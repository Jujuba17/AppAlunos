<style>
/* ==========================================================================
   1. TOKENS DE TEMA
   ========================================================================== */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --border: #dde2ea;
  --text: #101828;
  --muted: #5c6675;
  --accent: #047857;
  --accent-soft: #d7f2e7;
  --accent-ink: #ffffff;
  --ok: #047857;      --ok-soft: #d7f2e7;
  --warn: #a05a00;    --warn-soft: #fdeccd;
  --bad: #c0281f;     --bad-soft: #fbdedb;
  --info: #1f5fbf;    --info-soft: #dce8fb;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  --r: 14px;
  --r-sm: 9px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220;
    --surface: #141c2b;
    --surface-2: #1c2637;
    --border: #2a364a;
    --text: #e9edf4;
    --muted: #97a2b4;
    --accent: #10b981;
    --accent-soft: #123a2f;
    --accent-ink: #04140e;
    --ok: #34d399;    --ok-soft: #10352a;
    --warn: #fbbf24;  --warn-soft: #3a2c08;
    --bad: #f87171;   --bad-soft: #3d1a19;
    --info: #7cb0ff;  --info-soft: #14294a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #141c2b;
  --surface-2: #1c2637;
  --border: #2a364a;
  --text: #e9edf4;
  --muted: #97a2b4;
  --accent: #10b981;
  --accent-soft: #123a2f;
  --accent-ink: #04140e;
  --ok: #34d399;    --ok-soft: #10352a;

  color-scheme: dark;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; font-weight: 650; line-height: 1.25; }
h1 { font-size: 19px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }

/* ==========================================================================
   3. LAYOUT
   ========================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));

}
.topbar .grow { flex: 1; min-width: 0; }

  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-b);

<script>
/* ==========================================================================
   MODO DEMONSTRACAO
   Substitui /api/data por um armazenamento em memoria. Instalado antes do
   app iniciar, entao nenhuma requisicao sai desta pagina e nada e gravado
   em lugar nenhum. Recarregar devolve tudo ao estado inicial.
   ========================================================================== */
(function () {
  'use strict';
  var TABELAS = ['students', 'books', 'enrollments', 'sessions', 'assignments'];
  var guardado = null;   // { etag, data }
  var contador = 0;

  function resposta(corpo, status) {
    return new Response(JSON.stringify(corpo), {
      status: status || 200,
      headers: { 'Content-Type': 'application/json' },
    });
  }
  function vazio() {
    var d = {};
    for (var i = 0; i < TABELAS.length; i++) d[TABELAS[i]] = [];
    return d;
  }

  var fetchOriginal = window.fetch.bind(window);
  window.fetch = function (url, init) {
    init = init || {};
    var alvo = String(url && url.url ? url.url : url);
    if (alvo.indexOf('/api/data') === -1) return fetchOriginal(url, init);

    var metodo = (init.method || 'GET').toUpperCase();
    if (metodo === 'GET') {
      return Promise.resolve(resposta(
        guardado ? { etag: guardado.etag, data: guardado.data } : { etag: null, data: vazio() }
      ));
    }
    if (metodo === 'PUT') {
      var corpo;
      try { corpo = JSON.parse(init.body); } catch (e) {
        return Promise.resolve(resposta({ erro: 'Corpo invalido.' }, 400));
      }
      var atual = guardado ? guardado.etag : null;
      if ((corpo.etag || null) !== atual) {
        return Promise.resolve(resposta({
          erro: 'Os dados foram alterados em outro aparelho. Recarregue antes de salvar.',
        }, 409));
      }
      contador += 1;
      guardado = { etag: 'demo-' + contador, data: corpo.data };
      return Promise.resolve(resposta({ etag: guardado.etag }));
    }
    return Promise.resolve(resposta({ erro: 'Metodo nao suportado.' }, 405));
  };
})();
</script>

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;

/* --- datas (sempre em horario local, formato ISO yyyy-mm-dd) --- */
function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayISO() { return isoOf(new Date()); }
function parseISO(s) { const p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function fmtDate(s) { if (!s) return '--'; const d = parseISO(s); return isoOf(d).split('-').reverse().join('/'); }
function fmtShort(s) { if (!s) return '--'; const d = parseISO(s); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function fmtTime(t) { return t ? String(t).slice(0, 5) : ''; }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }

function nextDateForWeekday(wd, from) {

}
function initials(name) {
  const p = String(name || '?').trim().split(/\s+/);
  return ((p[0] || '')[0] || '?').toUpperCase() + (p.length > 1 ? (p[p.length - 1][0] || '').toUpperCase() : '');
}
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

/* --- UI: toast, sheet, confirmacao --- */
function toast(msg, bad) {
  const root = document.getElementById('toast-root');
  root.textContent = '';
  const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
  root.appendChild(t);
  setTimeout(() => t.remove(), bad ? 4500 : 2200);
}
let sheetStack = 0;
function openSheet({ title, body, footer }) {
  const root = document.getElementById('sheet-root');
  const close = () => {
    bg.remove();
    sheetStack = Math.max(0, sheetStack - 1);
    if (!sheetStack) document.body.style.overflow = '';
  };
  const sheet = h('div', { class: 'sheet' },
    h('div', { class: 'sheet-head' },
      h('h1', { class: 'grow ellip' }, title),
      h('button', { class: 'icon-btn', 'aria-label': 'Fechar', onclick: close }, ic.close())),
    h('div', { class: 'sheet-body' }, body),
    footer ? h('div', { class: 'sheet-foot' }, footer) : null);
  const bg = h('div', { class: 'sheet-bg', onclick: (e) => { if (e.target === bg) close(); } }, sheet);
  root.appendChild(bg);
  sheetStack++;
  document.body.style.overflow = 'hidden';
  return close;
}
function confirmSheet(title, msg, okLabel = 'Confirmar', danger = true) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; close(); resolve(v); } };
    const close = openSheet({
      title,
      body: h('p', { class: 'muted' }, msg),
      footer: [
        h('button', { class: 'btn', onclick: () => finish(false) }, 'Cancelar'),
        h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => finish(true) }, okLabel),
      ],
    });
  });
}
function busy(btn, on) {
  if (on) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = ''; btn.appendChild(h('span', { class: 'spin' })); }
  else { btn.disabled = false; btn.textContent = btn.dataset.label || 'Salvar'; }
}

/* ==========================================================================
   3. ESTADO E PERSISTENCIA
   O documento inteiro fica em memoria (DB). As alteracoes acontecem primeiro
   na memoria e depois sao enviadas de uma vez para /api/data, que regrava o
   JSON no Vercel Blob. ETAG identifica a versao que este aparelho leu: se
   outro aparelho gravou nesse meio-tempo, o envio volta 409 em vez de
   sobrescrever, e o app pergunta o que fazer.
   ========================================================================== */
const TABELAS = ['students', 'books', 'enrollments', 'sessions', 'assignments'];
const emptyDB = () => ({ students: [], books: [], enrollments: [], sessions: [], assignments: [] });

let SENHA = 'demonstracao';   /* modo demonstracao: entra direto */
let DB = emptyDB();
let ETAG = null;
let STALE = false;      // mostrando dados do cache, sem contato com o servidor
let PENDENTE = false;   // ha alteracoes locais ainda nao enviadas

function ordenar(d) {
  const txt = (v) => String(v == null ? '' : v);
  d.students.sort((a, b) => txt(a.name).localeCompare(txt(b.name)));
  d.books.sort((a, b) => txt(a.title).localeCompare(txt(b.title)));
  d.enrollments.sort((a, b) => txt(a.started_on).localeCompare(txt(b.started_on)));
  d.sessions.sort((a, b) => txt(b.session_date).localeCompare(txt(a.session_date)));
  d.assignments.sort((a, b) => txt(a.assigned_on).localeCompare(txt(b.assigned_on)));
  return d;
}
function normalizar(bruto) {
  const d = emptyDB();
  for (const t of TABELAS) if (bruto && Array.isArray(bruto[t])) d[t] = bruto[t];
  return ordenar(d);
}
function salvarCache() {
  store.set(K_CACHE, { etag: ETAG, pendente: PENDENTE, data: DB });
}
function lerCache() {
  const c = store.get(K_CACHE, null);
  if (!c) return;
  if (c.data) { DB = normalizar(c.data); ETAG = c.etag || null; PENDENTE = !!c.pendente; }
  else DB = normalizar(c);   // formato antigo, so os dados
}
/* modo demonstracao: ignora o cache do aparelho */

/* --- conversa com /api/data --- */
async function api(metodo, corpo) {
  let res;
  try {
    res = await fetch(API, {
      method: metodo,
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'x-app-senha': SENHA || '' },
      body: corpo ? JSON.stringify(corpo) : undefined,
    });
  } catch {
    const e = new Error('Sem conexao com o servidor.');
    e.offline = true;
    throw e;
  }
  let j = null;
  try { j = await res.json(); } catch {}
  if (!res.ok) {
    const e = new Error((j && j.erro) || ('Erro HTTP ' + res.status));
    e.status = res.status;
    throw e;
  }
  return j || {};
}
async function carregar() {
  const r = await api('GET');
  ETAG = r.etag || null;
  DB = normalizar(r.data);
  STALE = false;
  PENDENTE = false;
  salvarCache();
}
async function enviar() {
  const r = await api('PUT', { etag: ETAG, data: DB });
  ETAG = r.etag || null;
  STALE = false;
  PENDENTE = false;
  salvarCache();
}

/* --- gravacao: altera a memoria e envia; nunca perde o dado em caso de falha --- */
async function reload() {
  ordenar(DB);
  PENDENTE = true;
  salvarCache();
  try {
    await enviar();
  } catch (e) {
    if (e.status === 409) { render(); return sheetConflito(); }
    if (e.status === 401) { SENHA = null; store.del(K_SENHA); render(); return toast('Senha recusada. Entre novamente.', true); }
    STALE = !!e.offline;
    toast(e.message + ' As alteracoes ficaram guardadas neste aparelho.', true);
  }
  render();
}

/* ==========================================================================
   4. REGISTROS: ID, VALORES PADRAO, EXCLUSAO EM CASCATA
   O que antes o banco fazia (chave, defaults, cascata) acontece aqui.
   Os nomes sbInsert/sbUpdate/sbDelete foram mantidos: agora sao locais.
   ========================================================================== */
function novoId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
const PADROES = {
  students: () => ({
    name: '', start_date: todayISO(), contact: null, weekday: null, class_time: null,
    status: 'ativo', stopped_on: null, stop_reason: null, notes: null,
  }),
  books: () => ({ title: '', level: null, lesson_count: 12 }),
  enrollments: () => ({ started_on: todayISO(), active: true }),
  sessions: () => ({ status: 'realizada', notes: null }),
  assignments: () => ({
    lesson_label: null, assigned_session_id: null, review_session_id: null,
    result: 'pendente', attempt_no: 1, score: null, notes: null,
    assigned_on: todayISO(), reviewed_on: null,
  }),
};

/** Uma aula por aluno por dia - era a restricao unique do banco. */
function checarAulaUnica(studentId, data, ignorarId) {
  const bate = DB.sessions.find((s) =>
    s.student_id === studentId && s.session_date === data && s.id !== ignorarId);
  if (bate) throw new Error('Ja existe uma aula registrada para este aluno em ' + fmtDate(data) + '.');
}

async function sbInsert(table, row) {
  const linha = Object.assign({ id: novoId() }, PADROES[table] ? PADROES[table]() : {}, row);
  linha.created_at = new Date().toISOString();
  if (table === 'sessions') checarAulaUnica(linha.student_id, linha.session_date);
  DB[table].push(linha);
  return linha;
}
async function sbUpdate(table, id, patch) {
  const linha = DB[table].find((x) => x.id === id);
  if (!linha) throw new Error('Registro nao encontrado - recarregue o app.');
  if (table === 'sessions') {
    checarAulaUnica(
      patch.student_id || linha.student_id,
      patch.session_date || linha.session_date,
      id);
  }
  Object.assign(linha, patch);
  return linha;
}
async function sbDelete(table, id) {
  DB[table] = DB[table].filter((x) => x.id !== id);
  if (table === 'students') {
    for (const t of ['enrollments', 'sessions', 'assignments']) {
      DB[t] = DB[t].filter((x) => x.student_id !== id);
    }
  } else if (table === 'books') {
    DB.enrollments = DB.enrollments.filter((x) => x.book_id !== id);
    DB.assignments = DB.assignments.filter((x) => x.book_id !== id);
  } else if (table === 'sessions') {
    for (const a of DB.assignments) {
      if (a.assigned_session_id === id) a.assigned_session_id = null;
      if (a.review_session_id === id) a.review_session_id = null;
    }
  }
}

const student = (id) => DB.students.find((s) => s.id === id);
const book = (id) => DB.books.find((b) => b.id === id);
const bookTitle = (id) => (book(id) || {}).title || 'Livro removido';

const studentEnrollments = (sid) =>
  DB.enrollments.filter((e) => e.student_id === sid && book(e.book_id));
const activeEnrollments = (sid) => studentEnrollments(sid).filter((e) => e.active);
const studentAssignments = (sid) => DB.assignments.filter((a) => a.student_id === sid);
const pendingOf = (sid) => studentAssignments(sid).filter((a) => a.result === 'pendente');
const studentSessions = (sid) =>
  DB.sessions.filter((s) => s.student_id === sid)
    .slice().sort((a, b) => String(b.session_date).localeCompare(String(a.session_date)));

function bookProgress(sid, bid) {
  const b = book(bid);
  const total = b ? b.lesson_count : 0;
  const done = new Set(DB.assignments
    .filter((a) => a.student_id === sid && a.book_id === bid && a.result === 'aprovado')
    .map((a) => a.lesson_no)).size;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}
/** Menor licao do livro que ainda nao foi aprovada nem esta pendente. */
function suggestNextLesson(sid, bid) {
  const b = book(bid);
  if (!b) return 1;
  const taken = new Set(DB.assignments
    .filter((a) => a.student_id === sid && a.book_id === bid &&
                   (a.result === 'aprovado' || a.result === 'pendente'))
    .map((a) => a.lesson_no));
  for (let i = 1; i <= b.lesson_count; i++) if (!taken.has(i)) return i;
  return b.lesson_count;
}
const attemptsFor = (sid, bid, lesson) =>
  DB.assignments.filter((a) => a.student_id === sid && a.book_id === bid && a.lesson_no === lesson).length;

/** Licoes que o aluno reprovou, agrupadas por livro+licao, mais reprovadas primeiro. */
function failuresOf(sid) {
  const m = new Map();
  for (const a of DB.assignments) {
    if (a.student_id !== sid || a.result !== 'reprovado') continue;
    const k = a.book_id + '#' + a.lesson_no;
    m.set(k, (m.get(k) || 0) + 1);
  }
  return [...m.entries()]
    .map(([k, n]) => ({ book_id: k.split('#')[0], lesson_no: +k.split('#')[1], count: n }))
    .sort((x, y) => y.count - x.count || x.lesson_no - y.lesson_no);
}
function nextClassDate(st) {
  if (st.weekday == null || st.status !== 'ativo') return null;
  return nextDateForWeekday(st.weekday);
}
const sortByTime = (a, b) => String(a.class_time || '99').localeCompare(String(b.class_time || '99'));

   ========================================================================== */
function viewSenha() {
  document.getElementById('tabbar').hidden = true;
  setTopbar('Entrar');
  let senha = '';
  const btn = h('button', { class: 'btn primary block', onclick: entrar }, 'Entrar');
  const form = h('form', { onsubmit: (e) => { e.preventDefault(); entrar(); } },
    field('Senha do app', h('input', {
      type: 'password', autocomplete: 'current-password', required: true,
      placeholder: 'a senha que voce definiu no Vercel',
      oninput: (e) => { senha = e.target.value; },
    })),
    btn);

  async function entrar() {
    if (!senha) return toast('Digite a senha.', true);
    busy(btn, true);
    const anterior = SENHA;
    SENHA = senha;
    try {
      await carregar();
      store.set(K_SENHA, SENHA);
      toast('Tudo certo.');
      render();
    } catch (e) {
      SENHA = anterior;
      busy(btn, false);
      toast(e.message || 'Nao consegui entrar.', true);
    }
  }
  return h('div', {},
    h('div', { class: 'hero' },
      h('div', { class: 'avatar' }, ic.check()),
      h('h1', {}, 'Acompanhamento de Alunos'),
      h('p', { class: 'muted small', style: 'margin-top:6px' },
        'Uma senha so, a mesma em todos os aparelhos.')),
    h('div', { class: 'card' }, form),
    h('p', { class: 'tiny muted', style: 'margin-top:14px;text-align:center' },
      'A senha e a variavel APP_SENHA do seu projeto na Vercel.'));
}

/** Outro aparelho gravou depois que este leu. Quem decide e voce. */
function sheetConflito() {
  const close = openSheet({
    title: 'Alterado em outro aparelho',
    body: h('div', {},
      h('p', { class: 'small' },
        'Os dados na nuvem mudaram depois que este aparelho carregou. ' +
        'Para nao apagar o que foi feito no outro aparelho, o envio foi interrompido.'),
      h('p', { class: 'small muted', style: 'margin-top:10px' },
        'Suas alteracoes continuam guardadas aqui. Escolha o que fazer:')),
    footer: [
      h('button', {
        class: 'btn', onclick: async () => {
          close();
          try {
            await carregar();
            render();
            toast('Recarregado da nuvem.');
          } catch (e) { toast(e.message || 'Falha ao recarregar', true); }
        },
      }, 'Descartar as minhas'),
      h('button', {
        class: 'btn primary', onclick: async () => {
          close();
          try {
            const atual = await api('GET');       // pega o ETag novo
            ETAG = atual.etag || null;
            await enviar();                       // grava o que esta neste aparelho
            render();
            toast('Enviado. As alteracoes do outro aparelho foram substituidas.');
          } catch (e) { toast(e.message || 'Falha ao enviar', true); }
        },
      }, 'Manter as minhas'),
    ],
  });
}

   ========================================================================== */
function viewHoje() {
  const today = todayISO();
  const dow = parseISO(today).getDay();
  setTopbar('Hoje', WD[dow] + ', ' + fmtDate(today), {
    action: h('button', { class: 'icon-btn', 'aria-label': 'Atualizar', onclick: refreshNow }, ic.refresh()),
  });

  const actives = DB.students.filter((s) => s.status === 'ativo');
  const todayStudents = actives.filter((s) => s.weekday === dow).sort(sortByTime);
  const openPending = actives.reduce((n, s) => n + pendingOf(s.id).length, 0);
  const monthStart = today.slice(0, 7) + '-01';
  const absences = DB.sessions.filter((s) => s.session_date >= monthStart && s.status === 'falta_aluno').length;

  const upcoming = [];
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today, i);
    const wd = parseISO(d).getDay();
    const list = actives.filter((s) => s.weekday === wd).sort(sortByTime);
    if (list.length) upcoming.push({ date: d, wd, list });
  }

  return h('div', {},
    h('div', { class: 'section' },
      h('div', { class: 'kpi' },
        h('div', {}, h('b', {}, todayStudents.length), h('span', {}, 'aulas hoje')),
        h('div', {}, h('b', {}, openPending), h('span', {}, 'licoes pendentes')),
        h('div', {}, h('b', {}, actives.length), h('span', {}, 'alunos ativos')),
        h('div', {}, h('b', {}, absences), h('span', {}, 'faltas no mes')))),

    h('div', { class: 'section' },
      sectionHead('Aulas de hoje'),
      todayStudents.length
        ? todayStudents.map((s) => todayCard(s, today))
        : emptyState('Nenhuma aula hoje',
            'Nenhum aluno ativo tem aula na ' + WD[dow] + '.',
            h('a', { class: 'btn sm', href: '#/alunos' }, 'Ver alunos'))),

    h('div', { class: 'section' },
      sectionHead('Proximos 7 dias'),
      upcoming.length
        ? upcoming.map((g) => h('div', { class: 'card' },
            h('div', { class: 'row', style: 'margin-bottom:8px' },
              h('div', { class: 'grow', style: 'font-weight:600' }, WD[g.wd] + ' - ' + fmtShort(g.date)),
              badge(plural(g.list.length, 'aula', 'aulas'))),
            g.list.map((s) => h('div', { class: 'row small', style: 'padding:3px 0' },
              h('span', { class: 'muted', style: 'width:44px' }, fmtTime(s.class_time) || '--'),
              h('a', { class: 'grow ellip', href: '#/aluno/' + s.id, style: 'text-decoration:none;color:inherit' }, s.name),
              pendingOf(s.id).length ? badge(pendingOf(s.id).length + ' pend.', 'info') : null))))
        : emptyState('Semana livre', 'Nenhum aluno ativo com dia de aula definido.')));
}

function todayCard(st, today) {
  const pend = pendingOf(st.id);
  const done = DB.sessions.find((s) => s.student_id === st.id && s.session_date === today);
  return h('div', { class: 'card' },
    h('div', { class: 'row' },
      h('div', { class: 'avatar' }, initials(st.name)),
      h('div', { class: 'grow' },
        h('div', { class: 'ellip', style: 'font-weight:650' }, st.name),
        h('div', { class: 'tiny muted' },
          (fmtTime(st.class_time) ? fmtTime(st.class_time) + ' - ' : '') +
          (pend.length ? plural(pend.length, 'licao para conferir', 'licoes para conferir') : 'sem licoes pendentes'))),
      done ? statusBadge(done.status) : null),
    pend.length
      ? h('div', { style: 'margin-top:10px' },
          h('div', { class: 'wrap' }, pend.map((a) =>
            badge(lessonLabel(a) + ' - ' + bookTitle(a.book_id), 'info'))))
      : null,
    h('div', { class: 'row', style: 'margin-top:12px;gap:8px' },
      h('button', { class: 'btn primary grow', onclick: () => sheetSession(st.id, done || null) },
        done ? 'Editar aula de hoje' : 'Registrar aula'),
      h('a', { class: 'btn', href: '#/aluno/' + st.id }, 'Abrir')));
}

/** Sincroniza: envia o que estiver pendente e depois traz a versao da nuvem. */
async function refreshNow() {
  try {
    if (PENDENTE) {
      try {
        await enviar();
        toast('Alteracoes enviadas.');
      } catch (e) {
        if (e.status === 409) { render(); return sheetConflito(); }
        throw e;
      }
    }
    await carregar();
    render();
    toast('Atualizado.');
  } catch (e) {
    if (e.status === 401) { SENHA = null; store.del(K_SENHA); render(); return toast('Senha recusada.', true); }
    STALE = !!e.offline;
    render();
    toast(e.message || 'Falha ao atualizar', true);
  }
}

  });

  const search = h('input', {
    type: 'search', placeholder: 'Buscar aluno...', value: studentQuery,
    oninput: (e) => { studentQuery = e.target.value; renderList(); },
  });
  const listBox = h('div', {});

  function renderList() {
    const q = studentQuery.trim().toLowerCase();
    const found = DB.students.filter((s) => !q || s.name.toLowerCase().includes(q));
    listBox.textContent = '';
    if (!DB.students.length) {
      append(listBox, [emptyState('Nenhum aluno ainda',
        'Cadastre o primeiro aluno com o botao + no topo.',
        h('button', { class: 'btn primary sm', onclick: () => sheetStudent(null) }, 'Novo aluno'))]);
      return;
    }
    if (!found.length) {
      append(listBox, [emptyState('Nada encontrado', 'Nenhum aluno com "' + studentQuery + '".')]);
      return;
    }
    for (const key of ['ativo', 'pausado', 'parou']) {
      const group = found.filter((s) => s.status === key)
        .sort((a, b) => (a.weekday ?? 9) - (b.weekday ?? 9) || sortByTime(a, b) || a.name.localeCompare(b.name));
      if (!group.length) continue;
      append(listBox, [
        h('div', { class: 'section' },
          sectionHead(STU_ST[key].grupo + ' (' + group.length + ')'),
          group.map(studentRow)),
      ]);
    }
  }
  renderList();
  return h('div', {}, h('div', { class: 'section' }, search), listBox);
}

function studentRow(st) {
  const pend = pendingOf(st.id).length;
  const fails = failuresOf(st.id).reduce((n, f) => n + f.count, 0);
  const when = st.weekday != null
    ? WD_SHORT[st.weekday] + (st.class_time ? ' ' + fmtTime(st.class_time) : '')
    : 'sem dia definido';
  return h('a', { class: 'tap', href: '#/aluno/' + st.id },
    h('div', { class: 'row' },
      h('div', { class: 'avatar' }, initials(st.name)),
      h('div', { class: 'grow' },
        h('div', { class: 'ellip', style: 'font-weight:650' }, st.name),
        h('div', { class: 'tiny muted ellip' },
          when + ' - ' + plural(activeEnrollments(st.id).length, 'livro', 'livros'))),
      h('div', { class: 'wrap', style: 'justify-content:flex-end;max-width:44%' },
        st.status !== 'ativo' ? badge(STU_ST[st.status].l, STU_ST[st.status].c) : null,
        pend ? badge(pend + ' pend.', 'info') : null,
        fails ? badge(fails + ' repr.', 'bad') : null)));
}

        h('div', { class: 'row', style: 'margin-top:12px;gap:8px' },

    h('div', { class: 'section' },
      sectionHead('Licoes para a proxima aula'),

              h('div', { class: 'grow' },
                h('div', { style: 'font-weight:600' }, lessonLabel(a)),

            h('div', { class: 'wrap', style: 'margin-top:6px;justify-content:flex-end' },
              h('button', { class: 'btn sm ghost', onclick: () => toggleEnroll(en) }, en.active ? 'Encerrar livro' : 'Reativar'),

        : emptyState('Nenhum livro', 'Adicione o livro que o aluno esta usando.',
            h('button', { class: 'btn primary sm', onclick: () => sheetEnroll(st.id) }, 'Adicionar livro'))),

    /* --- reprovacoes --- */

function sessionCard(sid, s) {

  const assigned = DB.assignments.filter((a) => a.assigned_session_id === s.id);

    h('div', { class: 'row' },
      h('div', { class: 'grow' },
        h('div', { style: 'font-weight:650' }, fmtDate(s.session_date)),
        h('div', { class: 'tiny muted' }, WD[parseISO(s.session_date).getDay()])),
      statusBadge(s.status),
      h('button', { class: 'icon-btn', 'aria-label': 'Editar aula', onclick: () => sheetSession(sid, s) }, ic.edit())),
    reviewed.length
      ? h('div', { style: 'margin-top:10px' },
          h('div', { class: 'tiny muted', style: 'margin-bottom:5px' }, 'Conferidas nesta aula'),
          h('div', { class: 'wrap' }, reviewed.map((a) =>
            badge(lessonLabel(a) + ': ' + RESULTS[a.result].l, RESULTS[a.result].c))))
      : null,
    assigned.length
      ? h('div', { style: 'margin-top:10px' },
          h('div', { class: 'tiny muted', style: 'margin-bottom:5px' }, 'Passadas para a proxima'),
          h('div', { class: 'wrap' }, assigned.map((a) =>
            badge(lessonLabel(a) + ' - ' + bookTitle(a.book_id)))))
      : null,
    s.notes ? h('p', { class: 'small muted', style: 'margin-top:10px;white-space:pre-wrap' }, s.notes) : null);
}

/* ==========================================================================
   11. SHEET: REGISTRAR / EDITAR AULA  (fluxo principal)
   ========================================================================== */
function sheetSession(sid, existing) {
  const st = student(sid);
  const state = {
    date: existing ? existing.session_date : todayISO(),
    status: existing ? existing.status : 'realizada',
    notes: existing ? (existing.notes || '') : '',
  };

  /* Licoes a conferir: as pendentes + as que ja foram conferidas nesta aula.
     Exclui as licoes passadas nesta propria aula - nao se confere na mesma aula. */
  const toReview = [
    ...DB.assignments.filter((a) =>
      a.student_id === sid && a.result === 'pendente' &&
      !(existing && a.assigned_session_id === existing.id)),
    ...(existing ? DB.assignments.filter((a) => a.review_session_id === existing.id && a.result !== 'pendente') : []),
  ];
  const results = new Map(toReview.map((a) => [a.id, a.result]));

  /* Licoes passadas para a proxima aula. */
  const nextItems = existing
    ? DB.assignments.filter((a) => a.assigned_session_id === existing.id)
        .map((a) => ({ key: a.id, id: a.id, book_id: a.book_id, lesson_no: a.lesson_no, lesson_label: a.lesson_label || '' }))
    : [];
  const removedIds = [];
  let keySeq = 1;

  const enrolls = activeEnrollments(sid);
  const reviewBox = h('div', {});
  const nextBox = h('div', {});
  const addBox = h('div', {});
  const bodyWrap = h('div', {});

  /* ---- lista "conferir licoes" ---- */
  function drawReview() {
    reviewBox.textContent = '';
    if (state.status !== 'realizada') {
      append(reviewBox, [h('p', { class: 'small muted' },
        'Aula nao realizada: as licoes pendentes continuam pendentes para a proxima aula.')]);
      return;
    }
    if (!toReview.length) {
      append(reviewBox, [h('p', { class: 'small muted' }, 'Nenhuma licao pendente para conferir.')]);
      return;
    }
    append(reviewBox, toReview.map((a) => h('div', { class: 'item' },
      h('div', { style: 'font-weight:600' }, lessonLabel(a)),
      h('div', { class: 'tiny muted', style: 'margin-bottom:8px' },
        bookTitle(a.book_id) + ' - passada em ' + fmtDate(a.assigned_on) +
        (a.attempt_no > 1 ? ' - tentativa ' + a.attempt_no : '')),
      segmented(
        [['aprovado', 'Aprovado'], ['reprovado', 'Reprovado'], ['revisar', 'Revisar'],
         ['nao_trouxe', 'Nao trouxe'], ['pendente', 'Deixar pendente']],
        results.get(a.id),
        (v) => {
          results.set(a.id, v);
          /* Reprovou ou revisar: ja sugere repetir a mesma licao na proxima aula. */
          if (v === 'reprovado' || v === 'revisar') addNextItem(a.book_id, a.lesson_no, a.lesson_label || '', true);
          drawNext();
        }))));
  }

  /* ---- lista "licoes da proxima aula" ---- */
  function addNextItem(book_id, lesson_no, lesson_label, silent) {
    if (nextItems.some((it) => it.book_id === book_id && it.lesson_no === lesson_no)) {
      if (!silent) toast('Essa licao ja esta na lista.');
      return;
    }
    nextItems.push({ key: 'n' + keySeq++, id: null, book_id, lesson_no, lesson_label: lesson_label || '' });
  }
  function drawNext() {
    nextBox.textContent = '';
    if (!nextItems.length) {
      append(nextBox, [h('p', { class: 'small muted' }, 'Nenhuma licao adicionada ainda.')]);
      return;
    }
    append(nextBox, nextItems.map((it) => h('div', { class: 'item' },
      h('div', { class: 'row' },
        h('div', { class: 'grow' },
          h('div', { style: 'font-weight:600' }, it.lesson_label || ('Licao ' + it.lesson_no)),
          h('div', { class: 'tiny muted ellip' },
            bookTitle(it.book_id) +
            (attemptsFor(sid, it.book_id, it.lesson_no) && !it.id
              ? ' - tentativa ' + (attemptsFor(sid, it.book_id, it.lesson_no) + 1) : ''))),
        h('button', {
          class: 'icon-btn', 'aria-label': 'Remover',
          onclick: () => {
            if (it.id) removedIds.push(it.id);
            nextItems.splice(nextItems.indexOf(it), 1);
            drawNext();
          },
        }, ic.close())))));
  }

  /* Sugestao de proxima licao considerando tambem o que ja foi adicionado agora. */
  function localSuggest(bid) {
    const b = book(bid);
    if (!b) return 1;
    const taken = new Set(DB.assignments
      .filter((a) => a.student_id === sid && a.book_id === bid &&
                     (a.result === 'aprovado' || a.result === 'pendente'))
      .map((a) => a.lesson_no));
    for (const it of nextItems) if (it.book_id === bid) taken.add(it.lesson_no);
    for (let i = 1; i <= b.lesson_count; i++) if (!taken.has(i)) return i;
    return b.lesson_count;
  }

  /* ---- formulario de adicionar licao ---- */
  function drawAdd() {
    addBox.textContent = '';
    if (!enrolls.length) {
      append(addBox, [h('p', { class: 'small muted' },
        'Este aluno nao tem livro ativo. Adicione um livro na tela do aluno para poder atribuir licoes.')]);
      return;
    }
    let bid = enrolls[0].book_id;
    const lessonInput = h('input', {
      type: 'number', min: 1, inputmode: 'numeric', value: localSuggest(bid),
    });
    const labelInput = h('input', { type: 'text', placeholder: 'Rotulo opcional (ex: pag. 42)' });
    const bookSel = h('select', {
      onchange: (e) => { bid = e.target.value; lessonInput.value = localSuggest(bid); },
    }, enrolls.map((en) => h('option', { value: en.book_id }, bookTitle(en.book_id))));

    append(addBox, [
      field('Livro', bookSel),
      h('div', { class: 'grid2' },
        field('Licao n.', lessonInput),
        field('Rotulo', labelInput)),
      h('button', {
        class: 'btn block', onclick: () => {
          const n = parseInt(lessonInput.value, 10);
          const b = book(bid);
          if (!n || n < 1) return toast('Numero de licao invalido.', true);
          if (b && n > b.lesson_count) return toast('O livro tem ' + b.lesson_count + ' licoes.', true);
          addNextItem(bid, n, labelInput.value.trim());
          labelInput.value = '';
          drawNext();
          lessonInput.value = localSuggest(bid);
        },
      }, 'Adicionar licao'),
    ]);
  }

  function drawBody() {
    bodyWrap.textContent = '';
    append(bodyWrap, [
      field('Data da aula', h('input', {
        type: 'date', value: state.date, max: addDays(todayISO(), 30),
        onchange: (e) => { state.date = e.target.value || state.date; },
      })),
      field('O que aconteceu', segmented(
        [['realizada', 'Realizada'], ['falta_aluno', 'Aluno faltou'],
         ['cancelada', 'Cancelada'], ['sem_aula', 'Sem aula']],
        state.status,
        (v) => { state.status = v; drawReview(); toggleNextVisibility(); })),
      h('hr', { class: 'sep' }),
      h('h3', { style: 'margin-bottom:8px' }, 'Conferir licoes da aula anterior'),
      reviewBox,
      nextSection,
      h('hr', { class: 'sep' }),
      field('Observacoes', h('textarea', {
        placeholder: 'Anotacoes da aula...', value: state.notes,
        oninput: (e) => { state.notes = e.target.value; },
      })),
    ]);
    drawReview();
    drawNext();
    drawAdd();
    toggleNextVisibility();
  }

  const nextSection = h('div', {},
    h('hr', { class: 'sep' }),
    h('h3', { style: 'margin-bottom:8px' }, 'Licoes para a proxima aula'),
    nextBox,
    h('div', { style: 'margin-top:12px' }, addBox));

  function toggleNextVisibility() {
    nextSection.hidden = state.status !== 'realizada';
  }

  const saveBtn = h('button', { class: 'btn primary', onclick: save }, existing ? 'Salvar alteracoes' : 'Registrar aula');
  const footer = [h('button', { class: 'btn', onclick: () => close() }, 'Cancelar'), saveBtn];
  if (existing) {
    footer.unshift(h('button', {
      class: 'btn danger', style: 'flex:0 0 auto;padding:10px 12px', 'aria-label': 'Excluir aula',
      onclick: async () => {
        if (!await confirmSheet('Excluir aula?',
          'A aula de ' + fmtDate(existing.session_date) + ' sera removida. As licoes conferidas nela voltam a pendente.',
          'Excluir')) return;
        try {
          for (const a of DB.assignments.filter((x) => x.review_session_id === existing.id)) {
            await sbUpdate('assignments', a.id, { result: 'pendente', review_session_id: null, reviewed_on: null });
          }
          for (const a of DB.assignments.filter((x) => x.assigned_session_id === existing.id)) {
            await sbDelete('assignments', a.id);
          }
          await sbDelete('sessions', existing.id);
          close();
          await reload();
          toast('Aula excluida.');
        } catch (e) { toast(e.message || 'Falha ao excluir', true); }
      },
    }, ic.trash()));
  }

  async function save() {
    busy(saveBtn, true);
    try {
      let sess = existing;
      if (sess) {
        sess = await sbUpdate('sessions', sess.id,
          { session_date: state.date, status: state.status, notes: state.notes || null });
      } else {
        sess = await sbInsert('sessions',
          { student_id: sid, session_date: state.date, status: state.status, notes: state.notes || null });
      }

      if (state.status === 'realizada') {
        for (const a of toReview) {
          const r = results.get(a.id) || 'pendente';
          if (r === 'pendente') {
            if (a.result !== 'pendente') {
              await sbUpdate('assignments', a.id, { result: 'pendente', review_session_id: null, reviewed_on: null });
            }
          } else {
            await sbUpdate('assignments', a.id, { result: r, review_session_id: sess.id, reviewed_on: state.date });
          }
        }
        for (const it of nextItems) {
          if (it.id) continue;
          await sbInsert('assignments', {
            student_id: sid, book_id: it.book_id, lesson_no: it.lesson_no,
            lesson_label: it.lesson_label || null, assigned_session_id: sess.id,
            assigned_on: state.date, result: 'pendente',
            attempt_no: attemptsFor(sid, it.book_id, it.lesson_no) + 1,
          });
        }
      } else if (existing) {
        /* Aula deixou de ser "realizada": o que foi conferido nela volta a pendente. */
        for (const a of DB.assignments.filter((x) => x.review_session_id === existing.id)) {
          await sbUpdate('assignments', a.id, { result: 'pendente', review_session_id: null, reviewed_on: null });
        }
      }
      for (const id of removedIds) await sbDelete('assignments', id);

      close();
      await reload();
      toast('Aula registrada.');
    } catch (e) {
      toast(e.message || 'Falha ao salvar', true);
      busy(saveBtn, false);
    }
  }

  drawBody();
  const close = openSheet({
    title: (existing ? 'Editar aula - ' : 'Registrar aula - ') + st.name,
    body: bodyWrap,
    footer,
  });
}

/* ==========================================================================
   12. SHEETS: ALUNO, STATUS, MATRICULA, LIVRO
   ========================================================================== */
function sheetStudent(st) {
  const isNew = !st;
  const f = {
    name: st ? st.name : '',
    start_date: st ? st.start_date : todayISO(),
    weekday: st && st.weekday != null ? String(st.weekday) : '',
    class_time: st && st.class_time ? fmtTime(st.class_time) : '',
    contact: st ? (st.contact || '') : '',
    notes: st ? (st.notes || '') : '',
  };
  const saveBtn = h('button', { class: 'btn primary', onclick: save }, isNew ? 'Cadastrar' : 'Salvar');

  const body = h('div', {},
    field('Nome', h('input', { type: 'text', value: f.name, placeholder: 'Nome do aluno', oninput: (e) => { f.name = e.target.value; } })),
    h('div', { class: 'grid2' },
      field('Inicio', h('input', { type: 'date', value: f.start_date, onchange: (e) => { f.start_date = e.target.value; } })),
      field('Horario', h('input', { type: 'time', value: f.class_time, onchange: (e) => { f.class_time = e.target.value; } }))),
    field('Dia da aula', h('select', { onchange: (e) => { f.weekday = e.target.value; } },
      h('option', { value: '', selected: f.weekday === '' }, 'Sem dia definido'),
      WD.map((d, i) => h('option', { value: String(i), selected: f.weekday === String(i) }, d)))),
    field('Contato', h('input', { type: 'text', value: f.contact, placeholder: 'Telefone, e-mail, responsavel...', oninput: (e) => { f.contact = e.target.value; } })),
    field('Observacoes', h('textarea', { value: f.notes, oninput: (e) => { f.notes = e.target.value; } })),
    isNew ? null : h('button', {
      class: 'btn danger block', onclick: async () => {
        if (!await confirmSheet('Excluir aluno?',
          'Todas as aulas, licoes e livros de ' + st.name + ' serao apagados. Nao da para desfazer.',
          'Excluir tudo')) return;
        try { await sbDelete('students', st.id); close(); location.hash = '#/alunos'; await reload(); toast('Aluno excluido.'); }
        catch (e) { toast(e.message || 'Falha ao excluir', true); }
      },
    }, 'Excluir aluno'));

  async function save() {
    if (!f.name.trim()) return toast('Informe o nome.', true);
    busy(saveBtn, true);
    const row = {
      name: f.name.trim(),
      start_date: f.start_date || todayISO(),
      weekday: f.weekday === '' ? null : Number(f.weekday),
      class_time: f.class_time || null,
      contact: f.contact.trim() || null,
      notes: f.notes.trim() || null,
    };
    try {
      if (isNew) await sbInsert('students', row);
      else await sbUpdate('students', st.id, row);
      close();
      await reload();
      toast(isNew ? 'Aluno cadastrado.' : 'Aluno atualizado.');
    } catch (e) { toast(e.message || 'Falha ao salvar', true); busy(saveBtn, false); }
  }
  const close = openSheet({
    title: isNew ? 'Novo aluno' : 'Editar aluno',
    body,
    footer: [h('button', { class: 'btn', onclick: () => close() }, 'Cancelar'), saveBtn],
  });
}

function sheetStatus(st) {
  const f = {
    status: st.status,
    stopped_on: st.stopped_on || todayISO(),
    stop_reason: st.stop_reason || '',
  };
  const extra = h('div', {});
  function drawExtra() {
    extra.textContent = '';
    if (f.status !== 'parou') return;
    append(extra, [
      field('Data em que parou', h('input', {
        type: 'date', value: f.stopped_on, onchange: (e) => { f.stopped_on = e.target.value; },
      })),
      field('Motivo', h('input', {
        type: 'text', value: f.stop_reason, placeholder: 'Opcional',
        oninput: (e) => { f.stop_reason = e.target.value; },
      })),
    ]);

  const isNew = !bk;

    h('div', { class: 'grid2' },
      field('Nivel', h('input', { type: 'text', value: f.level, placeholder: 'Ex: A1, Book 2', oninput: (e) => { f.level = e.target.value; } })),
      field('N. de licoes', h('input', {

    isNew ? null : h('button', {

        const inUse = DB.enrollments.filter((e) => e.book_id === bk.id).length;
        if (!await confirmSheet('Excluir livro?',
          inUse ? 'O livro esta em ' + plural(inUse, 'aluno', 'alunos') + '. As licoes registradas dele tambem serao apagadas.'

      },
    }, 'Excluir livro'));

    const n = parseInt(f.lesson_count, 10);
    if (!f.title.trim()) return toast('Informe o titulo.', true);
    if (!n || n < 1 || n > 300) return toast('Numero de licoes entre 1 e 300.', true);

   ========================================================================== */
function viewRelatorios() {
  setTopbar('Relatorios', 'Ultimos 90 dias');
  const since = addDays(todayISO(), -90);
  const recent = DB.sessions.filter((s) => s.session_date >= since);
  const count = (st) => recent.filter((s) => s.status === st).length;

  const byStudent = DB.students.map((st) => {
    const ss = recent.filter((x) => x.student_id === st.id);
    const as = DB.assignments.filter((a) => a.student_id === st.id && a.reviewed_on && a.reviewed_on >= since);
    const ok = as.filter((a) => a.result === 'aprovado').length;
    const bad = as.filter((a) => a.result === 'reprovado').length;
    return {
      st,
      aulas: ss.filter((x) => x.status === 'realizada').length,
      faltas: ss.filter((x) => x.status === 'falta_aluno').length,
      ok, bad,
      taxa: ok + bad ? Math.round((ok / (ok + bad)) * 100) : null,
    };
  });

  /* Licoes mais reprovadas no geral (livro + licao) */
  const failMap = new Map();
  for (const a of DB.assignments) {
    if (a.result !== 'reprovado') continue;
    const k = a.book_id + '#' + a.lesson_no;
    const cur = failMap.get(k) || { book_id: a.book_id, lesson_no: a.lesson_no, count: 0, students: new Set() };
    cur.count++;
    cur.students.add(a.student_id);
    failMap.set(k, cur);
  }
  const topFails = [...failMap.values()].sort((a, b) => b.count - a.count).slice(0, 12);

  /* Alunos travados: mesma licao reprovada 2 ou mais vezes */
  const stuck = [];
  for (const st of DB.students.filter((s) => s.status === 'ativo')) {
    for (const f of failuresOf(st.id)) if (f.count >= 2) stuck.push({ st, ...f });
  }
  stuck.sort((a, b) => b.count - a.count);

  const faltosos = byStudent.filter((r) => r.faltas > 0).sort((a, b) => b.faltas - a.faltas);

  return h('div', {},
    h('div', { class: 'section' },
      h('div', { class: 'kpi' },
        h('div', {}, h('b', {}, count('realizada')), h('span', {}, 'aulas dadas')),
        h('div', {}, h('b', {}, count('falta_aluno')), h('span', {}, 'faltas')),
        h('div', {}, h('b', {}, count('cancelada')), h('span', {}, 'canceladas')),
        h('div', {}, h('b', {}, count('sem_aula')), h('span', {}, 'sem aula')))),

    h('div', { class: 'section' },
      h('div', { class: 'kpi' },
        h('div', {}, h('b', {}, DB.students.filter((s) => s.status === 'ativo').length), h('span', {}, 'ativos')),
        h('div', {}, h('b', {}, DB.students.filter((s) => s.status === 'pausado').length), h('span', {}, 'pausados')),
        h('div', {}, h('b', {}, DB.students.filter((s) => s.status === 'parou').length), h('span', {}, 'pararam')),
        h('div', {}, h('b', {}, DB.assignments.filter((a) => a.result === 'pendente').length), h('span', {}, 'pendentes')))),

    stuck.length
      ? h('div', { class: 'section' },
          sectionHead('Atencao: alunos travados'),
          h('div', { class: 'card' }, stuck.slice(0, 10).map((s) => h('div', { class: 'item' },
            h('div', { class: 'row' },
              h('div', { class: 'grow' },
                h('a', { href: '#/aluno/' + s.st.id, style: 'font-weight:600;text-decoration:none;color:inherit' }, s.st.name),
                h('div', { class: 'tiny muted ellip' }, 'Licao ' + s.lesson_no + ' - ' + bookTitle(s.book_id))),
              badge(s.count + 'x reprovado', 'bad'))))))
      : null,

    h('div', { class: 'section' },
      sectionHead('Desempenho por aluno'),
      byStudent.length
        ? h('div', { class: 'card' }, byStudent
            .sort((a, b) => (b.taxa ?? -1) - (a.taxa ?? -1))
            .map((r) => h('div', { class: 'item' },
              h('div', { class: 'row' },
                h('div', { class: 'grow' },
                  h('a', { href: '#/aluno/' + r.st.id, style: 'font-weight:600;text-decoration:none;color:inherit' }, r.st.name),
                  h('div', { class: 'tiny muted' },
                    r.aulas + ' aulas, ' + r.faltas + ' faltas, ' + r.ok + ' aprovadas, ' + r.bad + ' reprovadas')),
                r.taxa == null ? badge('sem dados')
                  : badge(r.taxa + '% aprov.', r.taxa >= 80 ? 'ok' : r.taxa >= 50 ? 'warn' : 'bad')))))
        : emptyState('Sem alunos', 'Cadastre alunos para ver o desempenho.')),

    topFails.length
      ? h('div', { class: 'section' },
          sectionHead('Licoes que mais reprovam'),
          h('div', { class: 'card' }, topFails.map((f) => h('div', { class: 'item' },
            h('div', { class: 'row' },
              h('div', { class: 'grow' },
                h('div', { style: 'font-weight:600' }, 'Licao ' + f.lesson_no),
                h('div', { class: 'tiny muted ellip' }, bookTitle(f.book_id) + ' - ' + plural(f.students.size, 'aluno', 'alunos'))),
              badge(f.count + 'x', 'bad'))))))
      : null,

    faltosos.length
      ? h('div', { class: 'section' },
          sectionHead('Faltas por aluno'),
          h('div', { class: 'card' }, faltosos.map((r) => h('div', { class: 'item' },
            h('div', { class: 'row' },
              h('div', { class: 'grow ellip' }, r.st.name),
              badge(plural(r.faltas, 'falta', 'faltas'), r.faltas > 2 ? 'bad' : 'warn'))))))
      : null);
}

function exportJson() {
  const payload = {
    app: 'acompanhamento-alunos', version: 1, exported_at: new Date().toISOString(),
    students: DB.students, books: DB.books, enrollments: DB.enrollments,
    sessions: DB.sessions, assignments: DB.assignments,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: 'backup-alunos-' + todayISO() + '.json' });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Backup gerado.');
}

function importJson() {
  const input = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); }
    catch { return toast('Arquivo invalido.', true); }
    if (data.app !== 'acompanhamento-alunos') return toast('Este JSON nao e um backup deste app.', true);
    const total = (data.students || []).length + (data.books || []).length +
                  (data.sessions || []).length + (data.assignments || []).length;
    if (!await confirmSheet('Restaurar backup?',
      'Serao inseridos ' + total + ' registros como novos. Nada e apagado - pode gerar duplicatas se os dados ja existirem.',
      'Restaurar', false)) return;
    try {
      await restore(data);
      await reload();
      toast('Backup restaurado.');
    } catch (e) { toast(e.message || 'Falha na restauracao', true); }
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(() => input.remove(), 1000);
}

/** Insere os registros remapeando os ids antigos para os novos. */
async function restore(data) {
  const mapBook = new Map(), mapStudent = new Map(), mapSession = new Map();

  for (const b of data.books || []) {
    const n = await sbInsert('books', {
      title: b.title, level: b.level || null, lesson_count: b.lesson_count || 12,
    });
    mapBook.set(b.id, n.id);
  }
  for (const s of data.students || []) {
    const n = await sbInsert('students', {
      name: s.name, start_date: s.start_date || todayISO(), contact: s.contact || null,
      weekday: s.weekday == null ? null : s.weekday, class_time: s.class_time || null,
      status: s.status || 'ativo', stopped_on: s.stopped_on || null,
      stop_reason: s.stop_reason || null, notes: s.notes || null,
    });
    mapStudent.set(s.id, n.id);
  }
  for (const e of data.enrollments || []) {
    if (!mapStudent.has(e.student_id) || !mapBook.has(e.book_id)) continue;
    await sbInsert('enrollments', {
      student_id: mapStudent.get(e.student_id), book_id: mapBook.get(e.book_id),
      started_on: e.started_on, active: e.active,
    });
  }
  for (const s of data.sessions || []) {
    if (!mapStudent.has(s.student_id)) continue;
    const n = await sbInsert('sessions', {
      student_id: mapStudent.get(s.student_id), session_date: s.session_date,
      status: s.status || 'realizada', notes: s.notes || null,
    });
    mapSession.set(s.id, n.id);
  }
  for (const a of data.assignments || []) {
    if (!mapStudent.has(a.student_id) || !mapBook.has(a.book_id)) continue;
    await sbInsert('assignments', {
      student_id: mapStudent.get(a.student_id), book_id: mapBook.get(a.book_id),
      lesson_no: a.lesson_no, lesson_label: a.lesson_label || null,
      assigned_session_id: mapSession.get(a.assigned_session_id) || null,
      review_session_id: mapSession.get(a.review_session_id) || null,
      result: a.result || 'pendente', attempt_no: a.attempt_no || 1,
      score: a.score == null ? null : a.score,
      notes: a.notes || null, assigned_on: a.assigned_on || todayISO(),
      reviewed_on: a.reviewed_on || null,
    });
  }
}

/* ==========================================================================
   17. TEMA, SERVICE WORKER, ROTEADOR, BOOT
   ========================================================================== */
function applyTheme() {
  const t = store.get(K_THEME, 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;   // SW nao funciona em file://
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

const ROUTES = [
  [/^\/hoje$/, () => viewHoje()],
  [/^\/alunos$/, () => viewAlunos()],
  [/^\/aluno\/(.+)$/, (m) => viewAluno(m[1])],
  [/^\/livros$/, () => viewLivros()],
  [/^\/relatorios$/, () => viewRelatorios()],
  [/^\/config$/, () => viewConfig()],
];

function currentTab(path) {
  if (path.startsWith('/aluno')) return '#/alunos';
  const hit = TABS.find(([href]) => href === '#' + path);
  return hit ? hit[0] : '#/hoje';
}

function render() {
  setBanner(
    PENDENTE ? 'Alteracoes guardadas neste aparelho, ainda nao enviadas. Toque em Config para enviar.'
      : STALE ? 'Sem conexao com o servidor - mostrando a ultima versao carregada.'
        : 'Demonstracao com dados ficticios. Nada e salvo - recarregue para recomecar.');
  if (!SENHA) { document.getElementById('tabbar').hidden = true; return mount(viewSenha()); }

  const path = (location.hash || '#/hoje').slice(1) || '/hoje';
  renderTabbar(currentTab(path));
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (m) { try { return mount(fn(m)); } catch (e) { console.error(e); return mount(emptyState('Erro na tela', e.message)); } }
  }
  location.hash = '#/hoje';
}

window.addEventListener('hashchange', render);

(async function boot() {
  applyTheme();
  /* service worker desativado no modo demonstracao */
  if (!location.hash) location.hash = '#/hoje';
  if (!SENHA) return render();
  try {
    if (PENDENTE) {
      /* Ficou algo por enviar da ultima vez: tenta subir antes de ler. */
      try { await enviar(); } catch (e) { if (e.status === 409) { render(); return sheetConflito(); } throw e; }
    }
    await carregar();
  } catch (e) {
    if (e.status === 401) {
      SENHA = null;
      store.del(K_SENHA);
      render();
      return toast('Senha recusada. Entre novamente.', true);
    }
    STALE = true;
    toast(e.message || 'Sem conexao com o servidor.', true);
  }
  render();
  if (!DB.students.length) await carregarExemplo();
})();
