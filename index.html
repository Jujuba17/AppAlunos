<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teoria Musical</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--fg:#2a2622;--card:#fff;--mut:#7a726a;--ac:#7c3aed;--ok:#16a34a;--bad:#dc2626;--bd:#e5ded5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#f1ece6;--card:#292623;--mut:#a69d93;--ac:#a78bfa;--ok:#4ade80;--bad:#f87171;--bd:#3d3834}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#f1ece6;--card:#292623;--mut:#a69d93;--ac:#a78bfa;--ok:#4ade80;--bad:#f87171;--bd:#3d3834}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mod{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.mod.lock{opacity:.5;cursor:default}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);white-space:nowrap}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
svg{max-width:100%;height:auto;color:var(--fg)}
.q{text-align:center}.fb{min-height:24px;margin:10px 0;font-weight:600;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input[type=text],input[type=number]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;font-size:13px}
</style></head><body><main id="app">Carregando…</main><div id="toast"></div>
<script>
const N=['Dó','Ré','Mi','Fá','Sol','Lá','Si'];
const MODS={
 notas_sol:{t:'Notas na clave de Sol',d:'Dó a Sol, com linhas suplementares'},
 notas_fa:{t:'Notas na clave de Fá',d:'Leitura na pauta da clave de Fá'},
 figuras:{t:'Figuras musicais',d:'Nome e valor (em tempos) de cada figura'},
 compasso:{t:'Compasso simples',d:'Unidade de tempo e de compasso, quantas figuras cabem'},
 simbolos:{t:'Símbolos musicais',d:'Claves, fermata, ligadura, ponto de aumento, acidentes'},
 compasso_composto:{t:'Compasso composto',d:'6/8, 9/8, 12/8: tempos e figuras pontuadas'}};
const KEYS=Object.keys(MODS);
const md=(a,b)=>((a%b)+b)%b, rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- desenho da pauta ---------- */
function staff(clef,n,type){
 type=type||'q';const cx=clef?150:110,cy=80-5*n;let s='<svg viewBox="0 0 240 130" width="320" role="img" aria-label="pauta">';
 for(let i=0;i<5;i++)s+=`<line x1="10" x2="230" y1="${40+i*10}" y2="${40+i*10}" stroke="currentColor" stroke-width="1.2"/>`;
 if(clef){s+=`<text x="16" y="${clef=='sol'?88:72}" font-size="${clef=='sol'?64:52}" fill="currentColor" font-family="'Noto Music','Segoe UI Symbol','Apple Symbols',serif">${clef=='sol'?'\u{1D11E}':'\u{1D122}'}</text>`;
  s+=`<text x="16" y="124" font-size="11" fill="currentColor" opacity=".6">clave de ${clef=='sol'?'Sol':'Fá'}</text>`;}
 for(let k=-2;k>=n;k-=2)s+=led(cx,80-5*k);
 for(let k=10;k<=n;k+=2)s+=led(cx,80-5*k);
 const open=type=='w'||type=='h',stem=type!='w',up=n<4;
 s+=`<ellipse cx="${cx}" cy="${cy}" rx="${type=='w'?8.5:7}" ry="5" transform="rotate(-20 ${cx} ${cy})" fill="${open?'none':'currentColor'}" stroke="currentColor" stroke-width="2"/>`;
 if(stem){const sx=up?cx+6.5:cx-6.5;s+=`<line x1="${sx}" x2="${sx}" y1="${cy+(up?-2:2)}" y2="${cy+(up?-35:35)}" stroke="currentColor" stroke-width="1.6"/>`;
  const fl=type=='e'?1:type=='s'?2:0;
  for(let f=0;f<fl;f++){const t=cy-35+f*8;s+=`<path d="M${sx} ${t} c1 10 13 12 10 26" fill="none" stroke="currentColor" stroke-width="2.2"/>`;}}
 return s+'</svg>';
}
const led=(cx,y)=>`<line x1="${cx-13}" x2="${cx+13}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="1.2"/>`;

/* ---------- geração de questões ---------- */
const G=(c,z,y)=>`<svg viewBox="0 0 160 100" width="160"><text x="80" y="${y}" font-size="${z}" text-anchor="middle" fill="currentColor" font-family="'Noto Music','Segoe UI Symbol','Apple Symbols',serif">${c}</text></svg>`;
const hd=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="8" ry="5.5" transform="rotate(-20 ${x} ${y})" fill="currentColor"/><line x1="${x+7}" x2="${x+7}" y1="${y-2}" y2="${y-38}" stroke="currentColor" stroke-width="2"/>`;
const V=b=>`<svg viewBox="0 0 160 100" width="160">${b}</svg>`;
const SYM=[
 {n:'Clave de Sol',d:'Indica que a 2ª linha da pauta é a nota Sol.',svg:G('\u{1D11E}',90,80)},
 {n:'Clave de Fá',d:'Indica que a 4ª linha da pauta é a nota Fá.',svg:G('\u{1D122}',70,62)},
 {n:'Clave de Dó',d:'Indica onde fica a nota Dó; usada, por exemplo, pela viola.',svg:G('\u{1D121}',70,70)},
 {n:'Fermata',d:'Prolonga a duração da nota ou da pausa, a critério do intérprete.',svg:V('<path d="M50 60 Q80 8 110 60" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="80" cy="46" r="4.5" fill="currentColor"/>')},
 {n:'Ligadura',d:'Une notas somando seus valores (se forem iguais) ou indica que sejam tocadas sem separação.',svg:V(hd(45,55)+hd(115,55)+'<path d="M45 66 Q80 92 115 66" fill="none" stroke="currentColor" stroke-width="2.5"/>')},
 {n:'Ponto de aumento',d:'Colocado após a figura, aumenta metade do seu valor.',svg:V(hd(65,62)+'<circle cx="90" cy="62" r="3.5" fill="currentColor"/>')},
 {n:'Sustenido',d:'Sobe a nota meio tom.',svg:G('\u266F',80,75)},
 {n:'Bemol',d:'Desce a nota meio tom.',svg:G('\u266D',80,75)},
 {n:'Bequadro',d:'Cancela um sustenido ou bemol anterior.',svg:G('\u266E',80,75)}];
function genS(){const S=rnd(SYM);const o=shuf([...shuf(SYM.map(x=>x.n).filter(x=>x!=S.n)).slice(0,3),S.n]);
 if(Math.random()<.5)return{svg:S.svg,text:'Qual é o nome deste símbolo?',opts:o,ans:o.indexOf(S.n),tag:S.n};
 return{text:'Que símbolo é este? '+S.d,opts:o,ans:o.indexOf(S.n),tag:S.n};}

const FIG={w:['Semibreve',4],h:['Mínima',2],q:['Semínima',1],e:['Colcheia','1/2'],s:['Semicolcheia','1/4']};
let lastN=null;
function gen(m){
 if(m=='simbolos')return genS();
 if(m=='notas_sol'||m=='notas_fa'){
  let n;do{n=Math.floor(Math.random()*12)-2}while(n===lastN);lastN=n;
  const sol=m=='notas_sol',i=md(n+(sol?2:4),7);
  return{svg:staff(sol?'sol':'fa',n),text:'Qual é o nome desta nota?',opts:N,ans:i,tag:(sol?'Sol':'Fá')+' · '+N[i]};
 }
 if(m=='figuras'){
  const t=rnd(Object.keys(FIG));
  if(Math.random()<.5)return{svg:staff(null,1,t),text:'Qual é o nome desta figura?',opts:Object.values(FIG).map(f=>f[0]),ans:Object.keys(FIG).indexOf(t),tag:FIG[t][0]};
  const vals=['4','2','1','1/2','1/4'];
  return{svg:staff(null,1,t),text:`Quantos tempos vale esta figura? (unidade de tempo: semínima)`,opts:vals,ans:vals.indexOf(String(FIG[t][1])),tag:'Valor: '+FIG[t][0]};
 }
 if(m=='compasso_composto')return genC();
 const r=Math.random();
 if(r<.3){const c=rnd([[2,4],[3,4],[4,4],[3,8],[2,2]]);const o=['2','3','4','6'];
  return{text:`No compasso ${c[0]}/${c[1]}, quantos tempos há em cada compasso?`,fm:c,opts:o,ans:o.indexOf(String(c[0]))};}
 if(r<.55){const c=rnd([[2,2],[3,4],[4,4],[3,8]]);const o=['Semibreve','Mínima','Semínima','Colcheia'];
  const a={2:'Mínima',4:'Semínima',8:'Colcheia'}[c[1]];
  return{text:`No compasso ${c[0]}/${c[1]}, qual figura é a unidade de tempo (vale 1 tempo)?`,fm:c,opts:o,ans:o.indexOf(a)};}
 if(r<.62){const c=rnd([[2,4],[3,4],[4,4],[2,2],[3,8]]);const o=['Semibreve','Mínima','Mínima pontuada','Semínima pontuada'];const a={'2/4':'Mínima','3/4':'Mínima pontuada','4/4':'Semibreve','2/2':'Semibreve','3/8':'Semínima pontuada'}[c.join('/')];
  return{text:`No compasso ${c[0]}/${c[1]}, qual figura é a unidade de compasso (preenche o compasso inteiro)?`,opts:o,ans:o.indexOf(a)};}
 if(r<.65){const o=['Quantidade de tempos por compasso','Figura que vale um tempo','Andamento da música','Altura da nota'];
  return{text:'Na fórmula de compasso, o número de cima indica:',opts:o,ans:0};}
 if(r<.75){const o=['Quantidade de tempos por compasso','Figura que vale um tempo','Andamento da música','Altura da nota'];
  return{text:'Na fórmula de compasso, o número de baixo indica:',opts:o,ans:1};}
 const cs=[[2,4,'Semínima',.25],[3,4,'Semínima',.25],[4,4,'Semínima',.25],[4,4,'Mínima',.5],[2,4,'Colcheia',.125],[3,4,'Colcheia',.125],[3,8,'Colcheia',.125],[2,2,'Mínima',.5],[3,4,'Mínima',.5]];
 const c=rnd(cs),a=(c[0]/c[1])/c[3];if(!Number.isInteger(a))return gen(m);
 const o=shuf([...new Set([a,a+1,Math.max(1,a-1),a*2])]).slice(0,4);if(!o.includes(a))o[0]=a;
 return{text:`Quantas ${c[2].toLowerCase()}s cabem em um compasso ${c[0]}/${c[1]}?`,opts:o.map(String),ans:o.indexOf(a)};
}

function genC(){
 const r=Math.random(),n4=['2','3','4','6'];
 if(r<.3){const c=rnd([[6,8,2],[9,8,3],[12,8,4],[6,4,2]]);return{text:`No compasso ${c[0]}/${c[1]}, quantos tempos há em cada compasso?`,opts:n4,ans:n4.indexOf(String(c[2]))};}
 if(r<.55){const c=rnd([[6,8],[9,8],[12,8],[6,4]]);const o=['Semínima','Semínima pontuada','Mínima','Mínima pontuada'];
  return{text:`No compasso ${c[0]}/${c[1]}, qual figura é a unidade de tempo (vale 1 tempo)?`,opts:o,ans:o.indexOf(c[1]==8?'Semínima pontuada':'Mínima pontuada')};}
 if(r<.7){const c=rnd([[6,8],[6,4]]);const o=['Mínima','Mínima pontuada','Semibreve','Semibreve pontuada'];
  return{text:`No compasso ${c[0]}/${c[1]}, qual figura é a unidade de compasso (preenche o compasso inteiro)?`,opts:o,ans:o.indexOf(c[1]==8?'Mínima pontuada':'Semibreve pontuada')};}
 if(r<.85){const c=rnd(['6/8','9/8','12/8']);return{text:`Quantas colcheias cabem em um tempo do compasso ${c}?`,opts:n4,ans:1};}
 return{text:'Nos compassos compostos, cada tempo se divide em quantas partes iguais?',opts:n4,ans:1};
}

/* ---------- estado e dados ---------- */
let TOKEN=null,owner=false,NAME='',unl=['notas_sol'],tab='praticar',view='home',prev=false;
let P={stats:{},err:{},exams:{}},allProg=[],allUnl={},roster=[],exams=[],editId=null,rmId=null,edelId=null,Q=[],qi=0,okc=0,curMod='',done=false,exm=null;
const pct=s=>s&&s.tot?Math.round(100*s.ok/s.tot):null;
try{TOKEN=sessionStorage.getItem('tk')}catch(e){}
async function api(action,body){
 try{
  const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:TOKEN,...body})});
  const j=await r.json().catch(()=>({error:'Erro de comunicação.'}));
  if(r.status==401){logout();return{error:j.error}}
  return j;
 }catch(e){return{error:'Sem conexão com o servidor.'}}
}
function logout(){TOKEN=null;owner=false;try{sessionStorage.removeItem('tk')}catch(e){}P={stats:{},err:{},exams:{}};unl=['notas_sol'];view='home';exm=null;draw();}
async function refresh(){
 if(!TOKEN){draw();return;}
 const r=await api('me');if(r.error||!TOKEN)return;
 owner=r.role=='prof';NAME=r.name;
 if(owner){roster=r.roster;exams=r.exams;allProg=r.allProg;allUnl=r.allUnl;}
 else{unl=r.unl;exams=r.exams;P={stats:r.prog.stats||{},err:r.prog.err||{},exams:r.prog.exams||{},cur:r.prog.cur};}
 draw();
}
async function saveP(){if(TOKEN&&!owner)await api('save',{stats:P.stats,err:P.err,cur:P.cur||null});}
function addErr(m,tag){(P.err[m]=P.err[m]||{})[tag]=(P.err[m][tag]||0)+1;}
async function saveRound(m,ok,tot){
 const o=P.stats[m]||{ok:0,tot:0,hist:[],r:0};
 P.stats[m]={ok:o.ok+ok,tot:o.tot+tot,s:o.s||0,r:(o.r||0)+1,hist:[...(o.hist||[]),Math.round(100*ok/tot)].slice(-8)};
 await saveP();
}
async function init(){await refresh();draw();}
const open=m=>owner||unl.includes(m);

/* ---------- telas ---------- */
const $=document.getElementById('app');
function draw(){
 if(view=='quiz'||view=='lesson')return;
 let h=`<h1>🎼 Teoria Musical</h1>`;
 if(!TOKEN){$.innerHTML=h+loginScr();return;}
 h+=`<div class="mut">Olá, ${esc(NAME)}! <button data-logout style="padding:2px 8px;font-size:12px">sair</button> ${owner?'':'Exercícios liberados pela professora conforme a aula.'}</div>`;
 if(owner)h+=`<div class="tabs">${[['praticar','Praticar'],['alunas','Alunas'],['provas','Provas']].map(t=>`<button class="${tab==t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}<button data-refresh>↻ Atualizar</button></div>`;
 h+=owner&&tab=='alunas'?alunas():owner&&tab=='provas'?provas():home();
 $.innerHTML=h;
}
function loginScr(){
 return `<h2>Entrar</h2><div class="card"><input type="text" id="lg" placeholder="Login" autocapitalize="none"><br><br><input type="password" id="pw" placeholder="Senha" style="font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:inherit"><br><br><button class="pri" data-login>Entrar</button><div class="fb" id="lerr" style="color:var(--bad)"></div><div class="mut">Alunas: login e senha criados pela professora.</div></div>`;
}
function home(){
 let h='<h2>Exercícios</h2>';
 let c=0;for(const m of KEYS){const s=P.stats[m],p=pct(s),o=open(m);if(!o)continue;c++;
  h+=`<div class="card mod ${o?'':'lock'}" ${o?`data-start="${m}"`:''}><div><b>${MODS[m].t}</b><div class="mut">${MODS[m].d}</div><div class="bar" style="margin-top:6px;width:160px"><i style="width:${p||0}%"></i></div><div class="mut">${p!=null?p+'% de acertos · '+s.tot+' questões · '+(s.r||1)+' tentativa(s)':'Ainda sem exercícios feitos'}</div></div><span class="pill">${o?(m=='simbolos'?'Lição':'Começar'):'🔒 bloqueado'}</span></div>`;}
 if(!c)h+='<div class="card mut">Nenhum exercício liberado ainda. Aguarde a professora liberar.</div>';
 const ex=exams.filter(e=>e.open||owner);
 if(ex.length){h+='<h2>Provas</h2>';for(const e of ex){const r=P.exams[e.id];
  h+=`<div class="card mod ${r?'lock':''}" ${r?'':`data-exam="${e.id}"`}><div><b>${esc(e.title)}</b><div class="mut">${e.n} questões · uma única tentativa</div></div><span class="pill">${r?(r.ok!=null?r.ok+'/'+r.tot:'iniciada'):'Fazer prova'}</span></div>`;}}
 return h;
}
const fmtDT=t=>t?new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
const nr=s=>s?(s.r||Math.round((s.tot||0)/10)):0;
const fmtD=d=>d?d.split('-').reverse().join('/'):'';
function stuHead(r){
 if(editId==r.id)return `<div class="card"><b>Editar aluna</b><div style="display:grid;gap:8px;margin:8px 0"><input type="text" id="ef-n" value="${esc(r.name)}" placeholder="Nome"><input type="text" id="ef-l" value="${esc(r.login||'')}" placeholder="Login" autocapitalize="none"><input type="text" id="ef-p" placeholder="Nova senha (vazio mantém a atual)"><label>Início: <input type="date" id="ef-d" value="${esc(r.start||'')}"></label></div><button class="pri" data-save="${r.id}">Salvar</button> <button data-cancel>Cancelar</button>`;
 return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${esc(r.name)}</b> <span class="mut">login: ${esc(r.login||'— sem acesso')}${r.start?' · início: '+fmtD(r.start):''}</span></div><div><button data-edit="${r.id}">editar</button> ${rmId==r.id?`<span class="mut">Remover?</span> <button data-rmyes="${r.id}">Sim</button> <button data-rmno>Não</button>`:`<button data-rm="${r.id}">remover</button>`}</div></div>`;
}
function alunas(){
 let h=`<h2>Cadastrar aluna</h2><div class="card"><input type="text" id="nn" placeholder="Nome da aluna"> <input type="text" id="nl" placeholder="Login (ex.: ana)" autocapitalize="none"> <input type="text" id="np" placeholder="Senha"> <label>Início: <input type="date" id="nd"></label> <button class="pri" data-add>Cadastrar</button><div class="mut" style="margin-top:6px">A aluna entra com esse login e senha. Anote a senha: depois dela salva você só pode redefinir.</div></div><h2>Alunas</h2>`;
 const list=roster.map(r=>({r,u:r.id}));
 if(!list.length)h+='<div class="card mut">Nenhuma aluna cadastrada.</div>';
 for(const{r,u}of list){
  const a=allProg.find(x=>x.id==u),un=allUnl[u]||['notas_sol'],st=a?.stats||{};
  h+=stuHead(r);
  if(!a){h+='<div class="mut">Ainda não acessou.</div></div>';continue;}
  h+=`<div class="mut" style="margin:6px 0">Último acesso: ${a.acc?fmtDT(a.acc):'—'}${a.accN?' · '+a.accN+' acesso(s)':''}${a.cur?`<br>⚠ Sessão não concluída: "${esc(a.cur.t)}", questão ${a.cur.q} de ${a.cur.n} (${fmtDT(a.cur.ts)})`:''}</div>`;
  h+='<table><tr><th>Módulo</th><th>Acertos</th><th>Feitas</th><th>Paradas</th><th>Últimas</th><th>Liberado</th></tr>';
  for(const m of KEYS){const s=st[m];h+=`<tr><td>${MODS[m].t}</td><td>${s&&pct(s)!=null?pct(s)+'%':'–'}</td><td>${nr(s)}${nr(s)>1?' (repetiu)':''}</td><td>${s&&(s.s||0)>nr(s)?(s.s-nr(s)):0}</td><td class="mut">${s?(s.hist||[]).slice(-4).join(' · '):''}</td><td><input type="checkbox" data-unl="${u}|${m}" ${un.includes(m)?'checked':''}></td></tr>`;}
  h+='</table>';
  const er=[];for(const m in a?.err||{})for(const t in a.err[m])er.push([m,t,a.err[m][t]]);er.sort((x,y)=>y[2]-x[2]);
  h+=`<div style="margin-top:8px"><b>Onde mais erra:</b> <span class="mut">${er.length?er.slice(0,5).map(x=>esc(x[1])+' ('+x[2]+'×)').join(' · '):'sem erros registrados'}</span></div>`;
  const pr=exams.filter(e=>a?.exams?.[e.id]);if(pr.length)h+='<div style="margin-top:6px"><b>Provas:</b> '+pr.map(e=>esc(e.title)+': '+(a.exams[e.id].ok!=null?a.exams[e.id].ok+'/'+a.exams[e.id].tot:'iniciada')+` <button data-reset="${u}|${e.id}">liberar nova tentativa</button>`).join(' · ')+'</div>';
  h+='</div>';}
 return h;
}
function provas(){
 let h=`<h2>Criar prova</h2><div class="card"><input type="text" id="et" placeholder="Título (ex.: Prova 1 – Notas)"><div style="margin:8px 0">${KEYS.map(m=>`<label><input type="checkbox" data-em="${m}"> ${MODS[m].t}</label>`).join('<br>')}</div>Questões: <input type="number" id="en" value="10" min="3" max="30" style="width:70px"> <button class="pri" data-mkexam>Criar prova</button></div><h2>Provas criadas</h2>`;
 if(!exams.length)h+='<div class="card mut">Nenhuma prova ainda.</div>';
 for(const e of exams){
  h+=`<div class="card"><b>${esc(e.title)}</b> <span class="mut">· ${e.n} questões · ${(e.mods||[]).map(m=>MODS[m]?.t).join(', ')}</span><div style="margin:6px 0"><label><input type="checkbox" data-eopen="${e.id}" ${e.open?'checked':''}> Liberada para as alunas</label> ${edelId==e.id?`<span class="mut">Excluir?</span> <button data-edelyes="${e.id}">Sim</button> <button data-edelno>Não</button>`:`<button data-edel="${e.id}">excluir</button>`}</div>`;
  const rs=allProg.filter(a=>a.exams?.[e.id]);
  h+=rs.length?'<table>'+rs.map(a=>{const r=a.exams[e.id];return `<tr><td>${esc(roster.find(r=>r.id==a.id)?.name||a.name)}</td><td>${r.ok!=null?r.ok+'/'+r.tot+' ('+Math.round(100*r.ok/r.tot)+'%)':'iniciada, não concluída'}</td></tr>`}).join('')+'</table>':'<div class="mut">Ninguém fez ainda.</div>';
  h+='</div>';}
 return h;
}
function lesson(){
 view='lesson';
 $.innerHTML=`<button data-home>← Voltar</button><h2>Lição: símbolos musicais</h2>${SYM.map(s=>`<div class="card" style="display:flex;gap:12px;align-items:center">${s.svg.replace('width="160"','width="110"')}<div><b>${s.n}</b><div class="mut">${s.d}</div></div></div>`).join('')}<button class="pri" data-start2="simbolos">Praticar agora</button>`;
}
function start(m,f){
 if(m=='simbolos'&&!f){lesson();return;}
 {const o=P.stats[m]||{ok:0,tot:0,hist:[],r:0};o.s=(o.s||0)+1;P.stats[m]=o;}
 curMod=m;exm=null;Q=Array.from({length:10},()=>({...gen(m),m}));qi=0;okc=0;view='quiz';showQ();
}
async function startExam(id){
 if(owner){toast('A professora não faz as provas.');return;}
 const r=await api('startExam',{eid:id});
 if(r.error){toast(r.error=='ja_feita'?'Você já fez esta prova.':r.error);await refresh();return;}
 P.exams[id]={start:Date.now()};exm={id,...r.exam};curMod='';
 Q=Array.from({length:exm.n},()=>{const m=rnd(exm.mods);return{...gen(m),m}});qi=0;okc=0;view='quiz';showQ();
}
function showQ(){
 const q=Q[qi];done=false;
 P.cur={t:exm?exm.title:MODS[curMod].t,q:qi+1,n:Q.length,ts:Date.now()};saveP();
 $.innerHTML=`${exm?'':'<button data-home>← Voltar</button>'}<div class="card q"><div class="mut">${exm?esc(exm.title):MODS[curMod].t} · questão ${qi+1} de ${Q.length}</div>${q.svg||''}<h2>${esc(q.text)}</h2><div class="opts">${q.opts.map((o,i)=>`<button data-ans="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div></div>`;
}
function answer(i){
 if(done)return;done=true;const q=Q[qi],bs=$.querySelectorAll('[data-ans]');
 if(i==q.ans)okc++;else addErr(q.m,q.tag||q.text.slice(0,60));
 if(exm){next();return;}
 bs[q.ans].classList.add('ok');if(i!=q.ans)bs[i].classList.add('bad');
 document.getElementById('fb').textContent=i==q.ans?'✓ Certo!':'✗ Era: '+q.opts[q.ans];
 document.getElementById('nx').innerHTML=`<button class="pri" data-next>${qi<Q.length-1?'Próxima':'Ver resultado'}</button>`;
}
async function next(){
 if(qi<Q.length-1){qi++;showQ();return;}
 const tot=Q.length,p=Math.round(100*okc/tot);
 if(exm){P.cur=null;P.exams[exm.id]={ok:okc,tot,ts:Date.now()};await api('finishExam',{eid:exm.id,ok:okc,tot,err:P.err});
  $.innerHTML=`<div class="card q"><h1>Prova concluída</h1><p>Você acertou ${okc} de ${tot}.</p><button class="pri" data-home>Início</button></div>`;exm=null;return;}
 P.cur=null;await saveRound(curMod,okc,tot);
 $.innerHTML=`<div class="card q"><h1>${p>=80?'🎉':'💪'} ${okc} de ${tot}</h1><p>${p>=80?'Muito bem! Avise a professora para liberar o próximo exercício.':p>=50?'Bom caminho! Repita para fixar.':'Vamos revisar com a professora e tentar de novo.'}</p><button class="pri" data-start2="${curMod}">Repetir</button> <button data-home>Início</button></div>`;
}
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500);};
const val=i=>(document.getElementById(i)||{}).value||'';
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-start],[data-exam]');if(!t)return;const d=t.dataset;
 const A=async(a,b,ok)=>{const r=await api(a,b);if(r.error)toast(r.error);else if(ok)toast(ok);await refresh();return r;};
 if(d.start)start(d.start);
 else if(d.start2)start(d.start2,1);
 else if(d.exam)startExam(d.exam);
 else if(d.ans!=null)answer(+d.ans);
 else if(d.next!=null)next();
 else if(d.home!=null){view='home';exm=null;await refresh();}
 else if(d.tab){tab=d.tab;draw();}
 else if(d.refresh!=null){await refresh();toast('Atualizado.');}
 else if(d.login!=null){const r=await api('login',{login:val('lg'),password:val('pw')});
  if(r.error){document.getElementById('lerr').textContent=r.error;return;}
  TOKEN=r.token;try{sessionStorage.setItem('tk',TOKEN)}catch(e){}view='home';await refresh();}
 else if(d.logout!=null)logout();
 else if(d.add!=null){const r=await A('addStudent',{name:val('nn'),login:val('nl'),password:val('np'),start:val('nd')},'Aluna cadastrada.');}
 else if(d.edit){editId=d.edit;rmId=null;draw();}
 else if(d.cancel!=null){editId=null;draw();}
 else if(d.save){const r=await A('editStudent',{id:d.save,name:val('ef-n'),login:val('ef-l'),password:val('ef-p'),start:val('ef-d')},'Salvo.');if(!r.error)editId=null;draw();}
 else if(d.rm){rmId=d.rm;editId=null;draw();}
 else if(d.rmno!=null){rmId=null;draw();}
 else if(d.rmyes){await A('removeStudent',{id:d.rmyes});rmId=null;draw();}
 else if(d.reset){const[u,id]=d.reset.split('|');await A('resetExam',{id:u,eid:id},'Nova tentativa liberada.');}
 else if(d.mkexam!=null){const mods=[...document.querySelectorAll('[data-em]:checked')].map(x=>x.dataset.em);
  await A('createExam',{title:val('et'),mods,n:+val('en')||10},'Prova criada.');}
 else if(d.edel){edelId=d.edel;draw();}
 else if(d.edelno!=null){edelId=null;draw();}
 else if(d.edelyes){await A('deleteExam',{eid:d.edelyes});edelId=null;draw();}
});
document.addEventListener('change',async e=>{const d=e.target.dataset;
 if(d.unl){const[id,m]=d.unl.split('|');const cur=allUnl[id]||['notas_sol'];const next=e.target.checked?[...new Set([...cur,m])]:cur.filter(x=>x!==m);
  allUnl[id]=next;await api('setUnl',{id,mods:next});}
 else if(d.eopen){await api('setExamOpen',{eid:d.eopen,open:e.target.checked});await refresh();}
});
init();
</script></body></html>
