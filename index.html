<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teoria Musical</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teoria Musical">
<style>
.install{border-color:var(--ac);border-width:2px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--fg:#2a2622;--card:#fff;--mut:#7a726a;--ac:#7c3aed;--ok:#16a34a;--bad:#dc2626;--bd:#e5ded5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#f1ece6;--card:#292623;--mut:#a69d93;--ac:#a78bfa;--ok:#4ade80;--bad:#f87171;--bd:#3d3834}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#f1ece6;--card:#292623;--mut:#a69d93;--ac:#a78bfa;--ok:#4ade80;--bad:#f87171;--bd:#3d3834}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mod{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.mod.lock{opacity:.5;cursor:default}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);white-space:nowrap}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.opts.col{grid-template-columns:1fr}.opts.col button{text-align:left}
h3{font-size:16px;margin:14px 0 6px}
details summary{cursor:pointer;color:var(--ac);font-size:14px;margin:6px 0}
ol.gab{padding-left:22px;font-size:14px}ol.gab li{margin:4px 0}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
svg{max-width:100%;height:auto;color:var(--fg)}
.q{text-align:center}.fb{min-height:24px;margin:10px 0;font-weight:600;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input[type=text],input[type=number]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;font-size:13px}
/* trilha de notas */
.unit{background:var(--ac);color:#fff;border-radius:14px;padding:10px 14px;margin:22px 0 6px;font-weight:700}
.unit .mut{color:#fff;opacity:.85}
.node-row{display:flex;flex-direction:column;align-items:center;width:fit-content;max-width:100%;margin:16px auto;text-align:center}
.node{width:70px;height:70px;border-radius:50%;font-size:24px;font-weight:700;border:none;padding:0;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.node.done{background:var(--ok);color:#fff}
.node.cur{background:var(--ac);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.node.lock{background:var(--bd);color:var(--mut);cursor:default;box-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node-lbl{max-width:230px;margin-top:8px;font-size:14px}
.qbar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 4px}.qbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
</style></head><body><main id="app">Carregando…</main><div id="toast"></div>
<script>
const N=['Dó','Ré','Mi','Fá','Sol','Lá','Si'];
const MODS={
 notas:{t:'Notas musicais',d:'Clave de Sol, clave de Fá e desafios',i:'🎵'},
 figuras:{t:'Figuras musicais',d:'Nome, valor, comparação e ponto de aumento',i:'🎶'},
 compasso:{t:'Compasso',d:'Compasso simples e composto',i:'🥁'},
 simbolos:{t:'Símbolos musicais',d:'Claves, acidentes, fermata, ligadura e ponto',i:'🔣'}};
const KEYS=Object.keys(MODS);
// módulos antigos que agora são parte de uma trilha
const ALIAS={notas_sol:'notas',notas_fa:'notas',compasso_composto:'compasso'};
const normU=u=>[...new Set((u||['notas']).map(m=>ALIAS[m]||m))];
const md=(a,b)=>((a%b)+b)%b, rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- desenho da pauta ---------- */
function staff(clef,n,type){
 type=type||'q';const cx=clef?150:110,cy=80-5*n;let s='<svg viewBox="0 0 240 130" width="320" role="img" aria-label="pauta">';
 for(let i=0;i<5;i++)s+=`<line x1="10" x2="230" y1="${40+i*10}" y2="${40+i*10}" stroke="currentColor" stroke-width="1.2"/>`;
 if(clef){s+=`<text x="16" y="${clef=='sol'?88:72}" font-size="${clef=='sol'?64:52}" fill="currentColor" font-family="'Noto Music','Segoe UI Symbol','Apple Symbols',serif">${clef=='sol'?'\u{1D11E}':'\u{1D122}'}</text>`;
  s+=`<text x="16" y="124" font-size="11" fill="currentColor" opacity=".6">clave de ${clef=='sol'?'Sol':'Fá'}</text>`;}
 for(let k=-2;k>=n;k-=2)s+=led(cx,80-5*k);
 for(let k=10;k<=n;k+=2)s+=led(cx,80-5*k);
 const open=type=='w'||type=='h',stem=type!='w',up=n<4;
 s+=`<ellipse cx="${cx}" cy="${cy}" rx="${type=='w'?8.5:7}" ry="5" transform="rotate(-20 ${cx} ${cy})" fill="${open?'none':'currentColor'}" stroke="currentColor" stroke-width="2"/>`;
 if(stem){const sx=up?cx+6.5:cx-6.5;s+=`<line x1="${sx}" x2="${sx}" y1="${cy+(up?-2:2)}" y2="${cy+(up?-35:35)}" stroke="currentColor" stroke-width="1.6"/>`;
  const fl=type=='e'?1:type=='s'?2:0;
  for(let f=0;f<fl;f++){const t=cy-35+f*8;s+=`<path d="M${sx} ${t} c1 10 13 12 10 26" fill="none" stroke="currentColor" stroke-width="2.2"/>`;}}
 return s+'</svg>';
}
const led=(cx,y)=>`<line x1="${cx-13}" x2="${cx+13}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="1.2"/>`;

/* ---------- geração de questões ---------- */
const G=(c,z,y)=>`<svg viewBox="0 0 160 100" width="160"><text x="80" y="${y}" font-size="${z}" text-anchor="middle" fill="currentColor" font-family="'Noto Music','Segoe UI Symbol','Apple Symbols',serif">${c}</text></svg>`;
const hd=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="8" ry="5.5" transform="rotate(-20 ${x} ${y})" fill="currentColor"/><line x1="${x+7}" x2="${x+7}" y1="${y-2}" y2="${y-38}" stroke="currentColor" stroke-width="2"/>`;
const V=b=>`<svg viewBox="0 0 160 100" width="160">${b}</svg>`;
const SYM=[
 {n:'Clave de Sol',d:'Indica que a 2ª linha da pauta é a nota Sol.',svg:G('\u{1D11E}',90,80)},
 {n:'Clave de Fá',d:'Indica que a 4ª linha da pauta é a nota Fá.',svg:G('\u{1D122}',70,62)},
 {n:'Clave de Dó',d:'Indica onde fica a nota Dó; usada, por exemplo, pela viola.',svg:G('\u{1D121}',70,70)},
 {n:'Fermata',d:'Prolonga a duração da nota ou da pausa, a critério do intérprete.',svg:V('<path d="M50 60 Q80 8 110 60" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="80" cy="46" r="4.5" fill="currentColor"/>')},
 {n:'Ligadura',d:'Une notas somando seus valores (se forem iguais) ou indica que sejam tocadas sem separação.',svg:V(hd(45,55)+hd(115,55)+'<path d="M45 66 Q80 92 115 66" fill="none" stroke="currentColor" stroke-width="2.5"/>')},
 {n:'Ponto de aumento',d:'Colocado após a figura, aumenta metade do seu valor.',svg:V(hd(65,62)+'<circle cx="90" cy="62" r="3.5" fill="currentColor"/>')},
 {n:'Sustenido',d:'Sobe a nota meio tom.',svg:G('\u266F',80,75)},
 {n:'Bemol',d:'Desce a nota meio tom.',svg:G('\u266D',80,75)},
 {n:'Bequadro',d:'Cancela um sustenido ou bemol anterior.',svg:G('\u266E',80,75)}];
function genS(list){list=list||SYM;const S=rnd(list);const o=shuf([...shuf(list.map(x=>x.n).filter(x=>x!=S.n)).slice(0,3),S.n]);
 if(Math.random()<.5)return{svg:S.svg,text:'Qual é o nome deste símbolo?',opts:o,ans:o.indexOf(S.n),tag:S.n};
 return{text:'Que símbolo é este? '+S.d,opts:o,ans:o.indexOf(S.n),tag:S.n};}
const symL=(...ns)=>SYM.filter(s=>ns.includes(s.n));

/* ---------- notas ---------- */
// Posição na pauta: 0 = 1ª linha, 1 = 1º espaço, 2 = 2ª linha ... 8 = 5ª linha; negativos e >8 usam linhas suplementares.
let lastN=null;
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const pos=n=>n%2==0?(n/2+1)+'ª linha':((n-1)/2+1)+'º espaço';
function genLvl(L){
 const sol=L.c=='sol'||(L.c=='mix'&&Math.random()<.5),cl=sol?'Sol':'Fá',nm=i=>N[md(i+(sol?2:4),7)];
 let n;do{n=rnd(L.ns)}while(n===lastN&&L.ns.length>1);lastN=n;
 if((L.k=='onde'||(L.k=='mix'&&Math.random()<.3))&&n>=0&&n<=8){
  const o=shuf([n,...shuf(R(0,8).filter(x=>nm(x)!=nm(n))).slice(0,3)]);
  return{text:`Na clave de ${cl}, onde fica a nota ${nm(n)}?`,opts:o.map(pos),ans:o.indexOf(n),tag:'Onde fica · '+cl+' · '+nm(n)};}
 return{svg:staff(sol?'sol':'fa',n),text:'Qual é o nome desta nota?',opts:N,ans:md(n+(sol?2:4),7),tag:cl+' · '+nm(n)};
}

/* ---------- figuras ---------- */
const FG=[['w','Semibreve',4],['h','Mínima',2],['q','Semínima',1],['e','Colcheia',.5],['s','Semicolcheia',.25]];
const TP={6:'6 tempos',4:'4 tempos',3:'3 tempos',2:'2 tempos',1.5:'1 tempo e meio',1:'1 tempo',.75:'3/4 de tempo',.5:'1/2 tempo',.25:'1/4 de tempo'};
const UT='Tendo a semínima como unidade de tempo';
const figSvg=(t,dot)=>{const s=staff(null,1,t);return dot?s.replace('</svg>','<circle cx="125" cy="75" r="2.8" fill="currentColor"/></svg>'):s;};
const fgNome=k=>{const L=FG.slice(0,k),f=rnd(L);return{svg:figSvg(f[0]),text:'Qual é o nome desta figura?',opts:L.map(x=>x[1]),ans:L.indexOf(f),tag:'Nome · '+f[1]};};
function fgValor(){const f=rnd(FG);
 if(Math.random()<.5)return{svg:figSvg(f[0]),text:UT+', quantos tempos vale esta figura?',opts:FG.map(x=>TP[x[2]]),ans:FG.indexOf(f),tag:'Valor · '+f[1]};
 return{text:UT+', qual figura vale '+TP[f[2]]+'?',opts:FG.map(x=>x[1]),ans:FG.indexOf(f),tag:'Valor · '+f[1]};}
function fgCompara(){const[a,b]=shuf(FG).slice(0,2),mais=Math.random()<.5,c=(a[2]>b[2])==mais?a:b,o=shuf([a[1],b[1]]);
 return{text:`Qual dura ${mais?'mais':'menos'}: ${a[1].toLowerCase()} ou ${b[1].toLowerCase()}?`,opts:o,ans:o.indexOf(c[1]),tag:'Comparar · '+a[1]+' × '+b[1]};}
function fgCabem(){let a,b;do{[a,b]=shuf(FG).slice(0,2)}while(a[2]<=b[2]);const o=['2','4','8','16'];
 return{text:`Quantas ${b[1].toLowerCase()}s cabem em uma ${a[1].toLowerCase()}?`,opts:o,ans:o.indexOf(String(a[2]/b[2])),tag:'Cabem · '+b[1]+' em '+a[1]};}
function fgPonto(){
 if(Math.random()<.2){const o=['Metade do seu valor','O dobro do seu valor','Um tempo a mais','Nada, só enfeita'];return{text:'O ponto de aumento acrescenta à figura:',opts:o,ans:0,tag:'Ponto de aumento'};}
 const L=FG.slice(0,4),f=rnd(L);
 return{svg:figSvg(f[0],1),text:`${UT}, quantos tempos vale a ${f[1].toLowerCase()} pontuada?`,opts:L.map(x=>TP[x[2]*1.5]),ans:L.indexOf(f),tag:'Pontuada · '+f[1]};}

/* ---------- compasso ---------- */
const fmSvg=(a,b)=>V(['47','92'].map((y,i)=>`<text x="80" y="${y}" font-size="44" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Georgia,serif">${i?b:a}</text>`).join(''));
const SIMP=[[2,4],[3,4],[4,4],[2,2],[3,8]],COMP=[[6,8],[9,8],[12,8],[6,4],[12,16]];
const F4=['Semibreve','Mínima','Semínima','Colcheia'],N4=['2','3','4','6'];
const fmt=c=>c[0]+'/'+c[1];
function cpFormula(){const r=Math.random(),c=rnd(SIMP);
 if(r<.6)return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, quantos tempos há em cada compasso?`,opts:N4,ans:N4.indexOf(String(c[0])),tag:'Tempos · '+fmt(c)};
 const o=['Quantos tempos tem o compasso','Qual figura vale um tempo','O andamento da música','A altura das notas'],cima=r<.8;
 return{text:`Na fórmula do compasso simples, o número de ${cima?'cima':'baixo'} indica:`,opts:o,ans:cima?0:1,tag:'Número de '+(cima?'cima':'baixo')};}
function cpUT(){const c=rnd(SIMP);return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, qual figura é a unidade de tempo (vale 1 tempo)?`,opts:F4,ans:F4.indexOf({2:'Mínima',4:'Semínima',8:'Colcheia'}[c[1]]),tag:'Unidade de tempo · '+fmt(c)};}
function cpUC(){const c=rnd(SIMP),o=['Mínima','Mínima pontuada','Semibreve','Semínima pontuada'],a={'2/4':'Mínima','3/4':'Mínima pontuada','4/4':'Semibreve','2/2':'Semibreve','3/8':'Semínima pontuada'}[fmt(c)];
 return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, qual figura preenche o compasso inteiro (unidade de compasso)?`,opts:o,ans:o.indexOf(a),tag:'Unidade de compasso · '+fmt(c)};}
function cpCabem(){const VL={Semibreve:1,Mínima:.5,Semínima:.25,Colcheia:.125,Semicolcheia:.0625};let c,f,n;
 do{c=rnd(SIMP);f=rnd(Object.keys(VL));n=(c[0]/c[1])/VL[f]}while(!Number.isInteger(n)||n<2||n>16);
 const o=shuf([n,...shuf([...new Set([n*2,n+1,n-1,Math.round(n/2),n+2])].filter(x=>x>0&&x!=n)).slice(0,3)]);
 return{svg:fmSvg(...c),text:`Quantas ${f.toLowerCase()}s cabem em um compasso ${fmt(c)}?`,opts:o.map(String),ans:o.indexOf(n),tag:'Cabem · '+f+' em '+fmt(c)};}
function cpClasse(){const c=rnd(SIMP),o=['Binário','Ternário','Quaternário'];return{svg:fmSvg(...c),text:`O compasso ${fmt(c)} é:`,opts:o,ans:c[0]-2,tag:'Classificação · '+fmt(c)};}
function cpSimpComp(){const comp=Math.random()<.5,c=rnd(comp?COMP:SIMP),o=['Simples','Composto'];return{svg:fmSvg(...c),text:`O compasso ${fmt(c)} é simples ou composto?`,opts:o,ans:comp?1:0,tag:'Simples ou composto · '+fmt(c)};}
function cpTemposC(){const c=rnd(COMP);return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, quantos tempos há em cada compasso?`,opts:N4,ans:N4.indexOf(String(c[0]/3)),tag:'Tempos · '+fmt(c)};}
function cpUTC(){const c=rnd(COMP),o=['Colcheia pontuada','Semínima pontuada','Mínima pontuada','Semínima'];
 return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, qual figura é a unidade de tempo?`,opts:o,ans:o.indexOf({16:'Colcheia pontuada',8:'Semínima pontuada',4:'Mínima pontuada'}[c[1]]),tag:'Unidade de tempo · '+fmt(c)};}
function cpDivisao(){const r=Math.random();
 if(r<.4){const c=rnd([[6,8],[9,8],[12,8]]);return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, quantas colcheias formam um tempo?`,opts:N4,ans:1,tag:'Divisão · '+fmt(c)};}
 if(r<.55)return{svg:fmSvg(6,4),text:'No compasso 6/4, quantas semínimas formam um tempo?',opts:N4,ans:1,tag:'Divisão · 6/4'};
 if(r<.7)return{text:'No compasso composto, cada tempo se divide em quantas partes iguais?',opts:N4,ans:1,tag:'Divisão do tempo composto'};
 if(r<.8)return{text:'No compasso simples, cada tempo se divide em quantas partes iguais?',opts:N4,ans:0,tag:'Divisão do tempo simples'};
 const c=rnd([[6,8],[12,8],[6,4]]),o=['Mínima pontuada','Semibreve pontuada','Semibreve','Mínima'];
 return{svg:fmSvg(...c),text:`No compasso ${fmt(c)}, qual figura preenche o compasso inteiro (unidade de compasso)?`,opts:o,ans:o.indexOf({'6/8':'Mínima pontuada','12/8':'Semibreve pontuada','6/4':'Semibreve pontuada'}[fmt(c)]),tag:'Unidade de compasso · '+fmt(c)};}
function cpClasseC(){const c=rnd(COMP),o=['Binário composto','Ternário composto','Quaternário composto','Binário simples'];return{svg:fmSvg(...c),text:`O compasso ${fmt(c)} é:`,opts:o,ans:c[0]/3-2,tag:'Classificação · '+fmt(c)};}

/* ---------- trilhas (níveis estilo Duolingo) ---------- */
const META=90; // % mínimo de acertos para abrir o próximo nível
// Cada nível: id (único entre todas as trilhas), u = unidade, t/d = título e descrição,
// g = gerador de questão; n = nº de questões (padrão 10); mix = sorteia entre os outros níveis da trilha.
const TR={
 notas:{units:[['Clave de Sol','Os primeiros passos na leitura'],['Clave de Fá','Agora a pauta dos graves'],['Desafios','As duas claves juntas']],lv:[
  {id:'s1',u:0,t:'Primeiras notas',d:'Dó, Ré, Mi, Fá e Sol',c:'sol',ns:R(-2,2)},
  {id:'s2',u:0,t:'Lá, Si e Dó',d:'Subindo a pauta',c:'sol',ns:R(0,5)},
  {id:'s3',u:0,t:'Notas nas linhas',d:'Mi, Sol, Si, Ré e Fá',c:'sol',ns:[0,2,4,6,8]},
  {id:'s4',u:0,t:'Notas nos espaços',d:'Fá, Lá, Dó e Mi',c:'sol',ns:[1,3,5,7]},
  {id:'s5',u:0,t:'Onde fica a nota?',d:'Linha ou espaço',c:'sol',ns:R(0,8),k:'onde'},
  {id:'s6',u:0,t:'Pauta inteira',d:'Todas as notas da pauta',c:'sol',ns:R(-2,9)},
  {id:'s7',u:0,t:'Linhas suplementares',d:'Notas acima e abaixo da pauta',c:'sol',ns:[-4,-3,-2,-1,9,10,11,12]},
  {id:'f1',u:1,t:'Primeiras notas',d:'Sol, Lá, Si, Dó e Ré',c:'fa',ns:R(0,4)},
  {id:'f2',u:1,t:'Notas nas linhas',d:'Sol, Si, Ré, Fá e Lá',c:'fa',ns:[0,2,4,6,8]},
  {id:'f3',u:1,t:'Notas nos espaços',d:'Lá, Dó, Mi e Sol',c:'fa',ns:[1,3,5,7]},
  {id:'f4',u:1,t:'Onde fica a nota?',d:'Linha ou espaço na clave de Fá',c:'fa',ns:R(0,8),k:'onde'},
  {id:'f5',u:1,t:'Pauta inteira',d:'Todas as notas, com o Dó central',c:'fa',ns:R(-2,10)},
  {id:'d1',u:2,t:'Sol ou Fá?',d:'As duas claves misturadas',c:'mix',ns:R(-2,9)},
  {id:'d2',u:2,t:'Desafio final',d:'Tudo junto, 15 questões',c:'mix',ns:R(-4,12),k:'mix',n:15}]},
 figuras:{units:[['Conhecendo as figuras','Nome e valor de cada uma'],['Comparando figuras','Quem dura mais e quantas cabem'],['Desafio','Tudo junto']],lv:[
  {id:'fg1',u:0,t:'As três primeiras',d:'Semibreve, mínima e semínima',g:()=>fgNome(3)},
  {id:'fg2',u:0,t:'Colcheia e semicolcheia',d:'Agora as cinco figuras',g:()=>fgNome(5)},
  {id:'fg3',u:0,t:'Quanto vale?',d:'O valor de cada figura em tempos',g:fgValor},
  {id:'fg4',u:1,t:'Qual dura mais?',d:'Comparando duas figuras',g:fgCompara},
  {id:'fg5',u:1,t:'Quantas cabem?',d:'Uma figura dentro da outra',g:fgCabem},
  {id:'fg6',u:1,t:'Ponto de aumento',d:'Figuras pontuadas',g:fgPonto},
  {id:'fg7',u:2,t:'Desafio das figuras',d:'Tudo junto, 15 questões',n:15,mix:1}]},

 if(exm){P.cur=null;P.exams[exm.id]={ok:okc,tot,ts:Date.now()};await api('finishExam',{eid:exm.id,ok:okc,tot,err:P.err});
  $.innerHTML=`<div class="card q"><h1>Prova concluída</h1><p>Você acertou ${okc} de ${tot}.</p><button class="pri" data-home>Início</button></div>`;exm=null;return;}
 P.cur=null;await saveRound(curMod,okc,tot);
 const k=curTr,i=curLvl,pass=p>=META,nx=TR[k].lv[i+1];
 $.innerHTML=`<div class="card q"><h1>${pass?'🎉':'💪'} ${okc} de ${tot}</h1><p>${pass?(nx?`Nível concluído! Abriu o próximo: <b>${esc(nx.t)}</b>`:`Parabéns, você completou a trilha de ${esc(MODS[k].t)}! 🏆`):`Faltou pouco! Você precisa de ${Math.ceil(META*tot/100)} acertos para abrir o próximo nível.`}</p>${pass&&nx?`<button class="pri" data-lvl="${k}|${i+1}">Próximo nível</button> `:''}<button ${pass?'':'class="pri"'} data-lvl="${k}|${i}">${pass?'Repetir':'Tentar de novo'}</button> <button data-trilha>Ver trilha</button></div>`;
}
async function sendExam(){
 $.innerHTML='<div class="card q"><p>Enviando a prova…</p></div>';
 const r=await api('finishExam',{eid:exm.id,ans:exm.ans});
 if(r.error||r.ok==null){$.innerHTML=`<div class="card q"><h2>Não foi possível enviar</h2><p class="mut">${esc(r.error||'Tente de novo.')}</p><button class="pri" data-resend>Tentar enviar de novo</button></div>`;return;}
 P.cur=null;P.exams[exm.id]={ok:r.ok,tot:r.tot,ts:Date.now()};
 $.innerHTML=`<div class="card q"><h1>Prova concluída</h1><p>Você acertou ${r.ok} de ${r.tot}.</p><button class="pri" data-home>Início</button></div>`;exm=null;
}
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500);};
const val=i=>(document.getElementById(i)||{}).value||'';
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-start],[data-exam],[data-open]');if(!t)return;const d=t.dataset;
 const A=async(a,b,ok)=>{const r=await api(a,b);if(r.error)toast(r.error);else if(ok)toast(ok);await refresh();return r;};
 if(d.start)start(d.start);
 else if(d.lesson!=null)lesson();
 else if(d.exam)startExam(d.exam);
 else if(d.ans!=null)answer(+d.ans);
 else if(d.next!=null)next();
 else if(d.lvl!=null){const[k,i]=d.lvl.split('|');startLvl(k,+i);}
 else if(d.trilha!=null){view='trilha';draw();scrollTo(0,0);}
 else if(d.resend!=null)sendExam();
 else if(d.open){openStu=openStu==d.open?null:d.open;rmId=null;draw();}
 else if(d.home!=null){view='home';exm=null;await refresh();}
 else if(d.tab){tab=d.tab;draw();}
 else if(d.refresh!=null){await refresh();toast('Atualizado.');}
 else if(d.install!=null){if(instEv){instEv.prompt();await instEv.userChoice.catch(()=>{});instEv=null;}draw();}
 else if(d.instno!=null){instHide=true;draw();}
 else if(d.login!=null){instHide=false;const r=await api('login',{login:val('lg'),password:val('pw')});
  if(r.error){document.getElementById('lerr').textContent=r.error;return;}
  TOKEN=r.token;try{sessionStorage.setItem('tk',TOKEN)}catch(e){}view='home';await refresh();}
 else if(d.logout!=null)logout();
 else if(d.add!=null){const r=await A('addStudent',{name:val('nn'),login:val('nl'),password:val('np'),start:val('nd')},'Aluno cadastrado.');}
 else if(d.edit){editId=d.edit;rmId=null;draw();}
 else if(d.cancel!=null){editId=null;draw();}
 else if(d.save){const r=await A('editStudent',{id:d.save,name:val('ef-n'),login:val('ef-l'),password:val('ef-p'),start:val('ef-d')},'Salvo.');if(!r.error)editId=null;draw();}
 else if(d.rm){rmId=d.rm;editId=null;draw();}
 else if(d.rmno!=null){rmId=null;draw();}
 else if(d.rmyes){await A('removeStudent',{id:d.rmyes});rmId=null;draw();}
 else if(d.reset){const[u,id]=d.reset.split('|');await A('resetExam',{id:u,eid:id},'Nova tentativa liberada.');}
 else if(d.mkexam!=null){const mods=[...document.querySelectorAll('[data-em]:checked')].map(x=>x.dataset.em);
  await A('createExam',{title:val('et'),mods,n:+val('en')||10},'Prova criada.');}
 else if(d.edel){edelId=d.edel;draw();}
 else if(d.edelno!=null){edelId=null;draw();}
 else if(d.edelyes){await A('deleteExam',{eid:d.edelyes});edelId=null;draw();}
});
document.addEventListener('change',async e=>{const d=e.target.dataset;
 if(d.unl){const[id,m]=d.unl.split('|');const cur=allUnl[id]||['notas'];const next=e.target.checked?[...new Set([...cur,m])]:cur.filter(x=>x!==m);
  allUnl[id]=next;draw();const r=await api('setUnl',{id,mods:next});if(r.error){toast(r.error);await refresh();}}
});
/* ---------- instalar no celular ---------- */
// Aviso mostrado depois do login para instalar o app na tela inicial. "Agora não" esconde até o próximo login.
let instEv=null,instHide=false;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobile=isIOS||/android|mobile/i.test(navigator.userAgent);
function installCard(){
 if(instHide||isStandalone()||(!instEv&&!isMobile))return '';
 const como=instEv?'<button class="pri" data-install>📲 Instalar o app</button>'
  :isIOS?'<div class="mut">No iPhone: toque em <b>Compartilhar</b> (o quadrado com a seta ↑) e depois em <b>Adicionar à Tela de Início</b>.</div>'
  :'<div class="mut">No menu do navegador (⋮), toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</div>';
 return `<div class="card install"><b>📲 Baixe o app no seu celular</b><div class="mut" style="margin:4px 0 10px">Assim você abre a Teoria Musical direto pela tela inicial, como um aplicativo.</div>${como} <button data-instno style="margin-top:8px">Agora não</button></div>`;
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;draw();});
addEventListener('appinstalled',()=>{instEv=null;instHide=true;toast('App instalado! 🎉');draw();});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

init();
</script></body></html>
